<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aeroportos Globais</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --vfr-color: #22c55e;
            --mvfr-color: #3b82f6;
            --ifr-color: #ef4444;
            --lifr-color: #a855f7;
            --na-color: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .version {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            width: 280px;
            font-size: 0.95rem;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .clear-btn {
            background-color: #475569 !important;
            color: #f8fafc !important;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .airport-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
            color: var(--text-secondary);
            transition: transform 0.1s;
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .fav-btn.favorited {
            color: #eab308;
        }

        .airport-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .airport-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-VFR { background-color: rgba(34, 197, 94, 0.2); color: var(--vfr-color); border: 1px solid var(--vfr-color); }
        .badge-MVFR { background-color: rgba(59, 130, 246, 0.2); color: var(--mvfr-color); border: 1px solid var(--mvfr-color); }
        .badge-IFR { background-color: rgba(239, 68, 68, 0.2); color: var(--ifr-color); border: 1px solid var(--ifr-color); }
        .badge-LIFR { background-color: rgba(168, 85, 247, 0.2); color: var(--lifr-color); border: 1px solid var(--lifr-color); }
        .badge-NA { background-color: rgba(100, 116, 139, 0.2); color: var(--na-color); border: 1px solid var(--na-color); }

        .card-info-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 10px;
            background: rgba(15, 23, 42, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .divider {
            background-color: var(--border-color);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .metar-box, .taf-box {
            font-family: monospace;
            font-size: 0.78rem;
            background: #0b0f19;
            padding: 8px;
            border-radius: 6px;
            color: #38bdf8;
            word-break: break-all;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .taf-box {
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.2);
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: bold;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>✈️ Painel de Aeroportos Globais</h1>
        <div class="version">VERSÃO 47</div>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar ICAO, IATA, Cidade..." oninput="filterAirports()">
            <button onclick="fetchData()">🔄 Atualizar Dados</button>
        </div>

        <div class="stats" id="statsContainer">
            <span>📊 Total: <strong id="statTotal">0</strong></span>
            <span>🟢 VFR: <strong id="statVfr">0</strong></span>
            <span>🔵 MVFR: <strong id="statMvfr">0</strong></span>
            <span>🔴 IFR: <strong id="statIfr">0</strong></span>
            <span>🟣 LIFR: <strong id="statLifr">0</strong></span>
        </div>

        <div class="filters" id="groupFilters">
            <span style="align-self: center; font-size: 0.85rem; color: var(--text-secondary); margin-right: 5px;">Região:</span>
            <button class="filter-btn active" onclick="filterGroup('ALL')">🌐 Todos</button>
            <button class="filter-btn" onclick="filterGroup('FAVS')">⭐ Favoritos</button>
            <button class="filter-btn" onclick="filterGroup('SOUTH_AMERICA')">🟢 América do Sul / Antártida</button>
            <button class="filter-btn" onclick="filterGroup('NORTH_AMERICA')">🔵 América do Norte</button>
            <button class="filter-btn" onclick="filterGroup('EUROPE')">🇪🇺 Europa</button>
            <button class="filter-btn" onclick="filterGroup('ASIA')">🌏 Ásia</button>
            <button class="filter-btn" onclick="filterGroup('MIDDLE_EAST')">🕌 Oriente Médio</button>
            <button class="filter-btn" onclick="filterGroup('AFRICA')">🌍 África</button>
            <button class="filter-btn" onclick="filterGroup('OCEANIA')">🇦🇺 Oceania / Austrália</button>
            <button class="filter-btn" onclick="filterGroup('AIRBASES')">🛡️ Bases Aéreas</button>
        </div>

        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" onclick="filterCategory('ALL')">Todas as Condições</button>
            <button class="filter-btn" onclick="filterCategory('VFR')">🟢 VFR (Visual)</button>
            <button class="filter-btn" onclick="filterCategory('MVFR')">🔵 MVFR (Marginal)</button>
            <button class="filter-btn" onclick="filterCategory('IFR')">🔴 IFR (Restrito)</button>
            <button class="filter-btn" onclick="filterCategory('LIFR')">🟣 LIFR (Crítico)</button>
            <button class="filter-btn clear-btn" onclick="clearAllFilters()">❌ Limpar Filtros</button>
        </div>

        <div id="updateStatus" class="version">Carregando dados meteorológicos...</div>
    </header>

    <main class="grid" id="airportGrid">
        <!-- Os cartões serão injetados dinamicamente via JavaScript -->
    </main>

    <script>
        const WORKER_URL = "https://weathered-grass-f181.alexgrodrigues.workers.dev";

        let airportData = [];
        let currentGroup = 'ALL';
        let currentCategory = 'ALL';
        let currentSearch = '';
        
        let favorites = JSON.parse(localStorage.getItem('weather_favorites') || '[]');

        function toggleFavorite(icao, event) {
            event.stopPropagation();
            if (favorites.includes(icao)) {
                favorites = favorites.filter(fav => fav !== icao);
            } else {
                favorites.push(icao);
            }
            localStorage.setItem('weather_favorites', JSON.stringify(favorites));
            renderGrid();
        }

        async function fetchData() {
            document.getElementById('updateStatus').innerText = "Buscando dados atualizados...";
            try {
                const response = await fetch(WORKER_URL);
                const json = await response.json();
                if (json.ok) {
                    airportData = json.rows;
                    document.getElementById('updateStatus').innerText = `Última atualização: ${json.fetchedAt} (${airportData.length} aeroportos carregados)`;
                    renderGrid();
                } else {
                    document.getElementById('updateStatus').innerText = "Erro ao carregar dados do servidor.";
                }
            } catch (error) {
                console.error("Erro de conexão:", error);
                document.getElementById('updateStatus').innerText = "Falha de conexão com o Cloudflare Worker.";
            }
        }

        function filterGroup(group) {
            currentGroup = group;
            updateActiveButtons('groupFilters', event.target);
            renderGrid();
        }

        function filterCategory(category) {
            currentCategory = category;
            updateActiveButtons('categoryFilters', event.target);
            renderGrid();
        }

        function filterAirports() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            renderGrid();
        }

        function clearAllFilters() {
            document.getElementById('searchInput').value = '';
            currentSearch = '';

            currentGroup = 'ALL';
            const groupContainer = document.getElementById('groupFilters');
            groupContainer.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            groupContainer.querySelector("button[onclick=\"filterGroup('ALL')\"]").classList.add('active');

            currentCategory = 'ALL';
            const catContainer = document.getElementById('categoryFilters');
            catContainer.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            catContainer.querySelector("button[onclick=\"filterCategory('ALL')\"]").classList.add('active');

            renderGrid();
        }

        function updateActiveButtons(containerId, clickedButton) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            clickedButton.classList.add('active');
        }

        function renderGrid() {
            const grid = document.getElementById('airportGrid');
            grid.innerHTML = '';

            let counts = { total: 0, vfr: 0, mvfr: 0, ifr: 0, lifr: 0 };

            const filtered = airportData.filter(item => {
                let matchGroup = true;
                if (currentGroup === 'FAVS') {
                    matchGroup = favorites.includes(item.icao);
                } else if (currentGroup === 'AIRBASES') {
                    matchGroup = item.isAirBase === true;
                } else if (currentGroup !== 'ALL') {
                    matchGroup = item.group === currentGroup;
                }

                let matchCategory = currentCategory === 'ALL' || item.category === currentCategory;

                let matchSearch = !currentSearch || 
                    item.icao.toLowerCase().includes(currentSearch) || 
                    (item.iata && item.iata.toLowerCase().includes(currentSearch)) || 
                    item.name.toLowerCase().includes(currentSearch) || 
                    item.city.toLowerCase().includes(currentSearch);

                return matchGroup && matchCategory && matchSearch;
            });

            airportData.forEach(item => {
                counts.total++;
                if (item.category === 'VFR') counts.vfr++;
                else if (item.category === 'MVFR') counts.mvfr++;
                else if (item.category === 'IFR') counts.ifr++;
                else if (item.category === 'LIFR') counts.lifr++;
            });

            document.getElementById('statTotal').innerText = counts.total;
            document.getElementById('statVfr').innerText = counts.vfr;
            document.getElementById('statMvfr').innerText = counts.mvfr;
            document.getElementById('statIfr').innerText = counts.ifr;
            document.getElementById('statLifr').innerText = counts.lifr;

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">Nenhum aeroporto encontrado com os filtros atuais.</div>';
                return;
            }

            filtered.forEach(item => {
                const badgeClass = `badge-${item.category === 'N/A' ? 'NA' : item.category}`;
                const isFav = favorites.includes(item.icao);
                
                let freqText = "—";
                if (item.frequencies) {
                    let fArr = [];
                    if (item.frequencies.tower) fArr.push(`TWR: ${item.frequencies.tower}`);
                    if (item.frequencies.ground) fArr.push(`GND: ${item.frequencies.ground}`);
                    if (item.frequencies.atis) fArr.push(`ATIS: ${item.frequencies.atis}`);
                    if (item.frequencies.military) fArr.push(`Mil: ${item.frequencies.military}`);
                    if (fArr.length > 0) freqText = fArr.join(" | ");
                }

                let runwaysText = item.runways && item.runways.length > 0 ? item.runways.join(", ") : "—";

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="airport-title-area">
                            <button class="fav-btn ${isFav ? 'favorited' : ''}" onclick="toggleFavorite('${item.icao}', event)" title="Favoritar aeroporto">
                                ${isFav ? '★' : '☆'}
                            </button>
                            <div>
                                <div class="airport-title">${item.icao} ${item.iata ? '· ' + item.iata : ''} — ${item.name}</div>
                                <div class="airport-sub">${item.city} (${item.country})</div>
                            </div>
                        </div>
                        <span class="badge ${badgeClass}">${item.category}</span>
                    </div>

                    <div class="card-info-grid">
                        <div class="info-item">
                            <span class="info-label">💨 Vento</span>
                            <span><strong>${item.wind}</strong></span>
                        </div>
                        <div class="divider"></div>
                        <div class="info-item">
                            <span class="info-label">⚖️ QNH / Pressão</span>
                            <span><strong>${item.pressure}</strong></span>
                        </div>
                    </div>

                    <div class="card-info-grid">
                        <div class="info-item">
                            <span class="info-label">🌡️ Temperatura</span>
                            <span><strong>${item.temperature.current !== null ? item.temperature.current + '°C' : '—'}</strong></span>
                        </div>
                        <div class="divider"></div>
                        <div class="info-item">
                            <span class="info-label">💧 Ponto de Orvalho</span>
                            <span><strong>${item.temperature.dewpoint !== null ? item.temperature.dewpoint + '°C' : '—'}</strong></span>
                        </div>
                    </div>

                    <div style="font-size: 0.8rem; color: var(--text-secondary); background: rgba(15, 23, 42, 0.2); padding: 6px 10px; border-radius: 6px;">
                        <div>🛫 <strong>Pistas:</strong> ${runwaysText}</div>
                        <div>📻 <strong>Frequências:</strong> ${freqText}</div>
                    </div>

                    <div>
                        <div class="section-title">METAR</div>
                        <div class="metar-box">${item.metar || 'Relatório METAR indisponível no momento.'}</div>
                    </div>

                    <div>
                        <div class="section-title">TAF</div>
                        <div class="taf-box">${item.taf || 'Previsão TAF indisponível no momento.'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        fetchData();
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
