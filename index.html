<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Painel de Aeroportos Globais</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --vfr-color: #22c55e;
            --mvfr-color: #3b82f6;
            --ifr-color: #ef4444;
            --lifr-color: #a855f7;
            --na-color: #64748b;
            --missing-color: #f87171;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        h1 svg {
            fill: #38bdf8;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .version {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            width: 280px;
            font-size: 0.95rem;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #2563eb;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .clear-btn {
            background-color: #475569 !important;
            color: #f8fafc !important;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .airport-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0;
            color: var(--text-secondary);
            transition: transform 0.1s;
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .fav-btn.favorited {
            color: #eab308;
        }

        .airport-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .airport-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-VFR { background-color: rgba(34, 197, 94, 0.2); color: var(--vfr-color); border: 1px solid var(--vfr-color); }
        .badge-MVFR { background-color: rgba(59, 130, 246, 0.2); color: var(--mvfr-color); border: 1px solid var(--mvfr-color); }
        .badge-IFR { background-color: rgba(239, 68, 68, 0.2); color: var(--ifr-color); border: 1px solid var(--ifr-color); }
        .badge-LIFR { background-color: rgba(168, 85, 247, 0.2); color: var(--lifr-color); border: 1px solid var(--lifr-color); }
        .badge-NA { background-color: rgba(100, 116, 139, 0.2); color: var(--na-color); border: 1px solid var(--na-color); }
        .badge-MISSING { background-color: rgba(248, 113, 113, 0.2); color: var(--missing-color); border: 1px solid var(--missing-color); }

        .card-info-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 10px;
            background: rgba(15, 23, 42, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .divider {
            background-color: var(--border-color);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .metar-box, .taf-box {
            font-family: monospace;
            font-size: 0.78rem;
            background: #0b0f19;
            padding: 8px;
            border-radius: 6px;
            color: #38bdf8;
            word-break: break-all;
            border: 1px solid rgba(56, 189, 248, 0.2);
            max-height: 120px;
            overflow-y: auto;
        }

        .taf-box {
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: bold;
            text-transform: uppercase;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

        .tag-military {
            display: inline-block;
            background-color: rgba(234, 179, 8, 0.15);
            color: #eab308;
            border: 1px solid rgba(234, 179, 8, 0.4);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36">
                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
            Painel de Aeroportos Globais
        </h1>
        <div class="version">VERSÃO 50 (Esquema v7)</div>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar ICAO, IATA, Cidade..." oninput="filterAirports()">
            <button id="refreshBtn" onclick="fetchData()">🔄 Atualizar Dados</button>
        </div>

        <div class="stats" id="statsContainer">
            <span>📊 Base: <strong id="statTotalGlobal">0</strong> | Na Seleção Atual: <strong id="statTotalFiltered">0</strong></span>
            <span>🟢 VFR: <strong id="statVfr">0</strong></span>
            <span>🔵 MVFR: <strong id="statMvfr">0</strong></span>
            <span>🔴 IFR: <strong id="statIfr">0</strong></span>
            <span>🟣 LIFR: <strong id="statLifr">0</strong></span>
            <span>⚪ N/A: <strong id="statNa">0</strong></span>
            <span>⚠️ Ausentes: <strong id="statMissing">0</strong></span>
        </div>

        <div class="filters" id="groupFilters">
            <span style="align-self: center; font-size: 0.85rem; color: var(--text-secondary); margin-right: 5px;">Região:</span>
            <button class="filter-btn active" data-group="ALL" onclick="filterGroup('ALL', this)">🌐 Todos</button>
            <button class="filter-btn" data-group="FAVS" onclick="filterGroup('FAVS', this)">⭐ Favoritos</button>
            <button class="filter-btn" data-group="SOUTH_AMERICA" onclick="filterGroup('SOUTH_AMERICA', this)">🟢 América do Sul / Antártida</button>
            <button class="filter-btn" data-group="NORTH_AMERICA" onclick="filterGroup('NORTH_AMERICA', this)">🔵 América do Norte</button>
            <button class="filter-btn" data-group="EUROPE" onclick="filterGroup('EUROPE', this)">🇪🇺 Europa</button>
            <button class="filter-btn" data-group="ASIA" onclick="filterGroup('ASIA', this)">🌏 Ásia</button>
            <button class="filter-btn" data-group="MIDDLE_EAST" onclick="filterGroup('MIDDLE_EAST', this)">🕌 Oriente Médio</button>
            <button class="filter-btn" data-group="AFRICA" onclick="filterGroup('AFRICA', this)">🌍 África</button>
            <button class="filter-btn" data-group="OCEANIA" onclick="filterGroup('OCEANIA', this)">🇦🇺 Oceania / Austrália</button>
            <button class="filter-btn" data-group="AIRBASES" onclick="filterGroup('AIRBASES', this)">🛡️ Bases Aéreas</button>
        </div>

        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" data-cat="ALL" onclick="filterCategory('ALL', this)">Todas as Condições</button>
            <button class="filter-btn" data-cat="VFR" onclick="filterCategory('VFR', this)">🟢 VFR</button>
            <button class="filter-btn" data-cat="MVFR" onclick="filterCategory('MVFR', this)">🔵 MVFR</button>
            <button class="filter-btn" data-cat="IFR" onclick="filterCategory('IFR', this)">🔴 IFR</button>
            <button class="filter-btn" data-cat="LIFR" onclick="filterCategory('LIFR', this)">🟣 LIFR</button>
            <button class="filter-btn" data-cat="NA" onclick="filterCategory('NA', this)">⚪ N/A</button>
            <button class="filter-btn clear-btn" onclick="clearAllFilters()">❌ Limpar Filtros</button>
        </div>

        <div id="updateStatus" class="version">Carregando dados meteorológicos...</div>
    </header>

    <main class="grid" id="airportGrid">
        <!-- Grade gerada com segurança total via DOM API -->
    </main>

    <script>
        const WORKER_URL = "https://weathered-grass-f181.alexgrodrigues.workers.dev";

        let airportData = [];
        let currentGroup = 'ALL';
        let currentCategory = 'ALL';
        let currentSearch = '';
        let isFetching = false;
        let tafVisibility = {};

        const COUNTRY_NAMES = {
            "BR": "Brasil", "CL": "Chile", "US": "Estados Unidos", "GB": "Reino Unido",
            "FR": "França", "DE": "Alemanha", "AR": "Argentina", "UY": "Uruguai",
            "PY": "Paraguai", "CO": "Colômbia", "PE": "Peru", "ZA": "África do Sul",
            "AU": "Austrália", "NZ": "Nova Zelândia", "JP": "Japão", "CN": "China",
            "AE": "Emirados Árabes Unidos", "QA": "Catar"
        };

        let favorites = [];
        try {
            const rawFavs = localStorage.getItem('weather_favorites');
            if (rawFavs) {
                const parsed = JSON.parse(rawFavs);
                if (Array.isArray(parsed)) {
                    favorites = parsed
                        .map(item => String(item || "").trim().toUpperCase())
                        .filter(code => /^[A-Z]{4}$/.test(code));
                }
            }
        } catch (e) {
            console.warn("localStorage inacessível.", e);
            favorites = [];
        }

        function toggleFavorite(icao, event) {
            if (event) event.stopPropagation();
            const cleanIcao = String(icao || "").trim().toUpperCase();
            if (!/^[A-Z]{4}$/.test(cleanIcao)) return;

            if (favorites.includes(cleanIcao)) {
                favorites = favorites.filter(fav => fav !== cleanIcao);
            } else {
                favorites.push(cleanIcao);
            }

            try {
                localStorage.setItem('weather_favorites', JSON.stringify(favorites));
            } catch (e) {
                console.warn("Falha ao persistir favorito no localStorage", e);
            }
            renderGrid();
        }

        async function fetchData() {
            if (isFetching) return;
            isFetching = true;
            
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.disabled = true;
                refreshBtn.textContent = "⏳ Consultando...";
            }

            document.getElementById('updateStatus').innerText = "Consultando dados meteorológicos...";
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const response = await fetch(WORKER_URL, { 
                    cache: "no-store",
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const json = await response.json();
                
                if (!json || json.ok !== true || !Array.isArray(json.rows)) {
                    throw new Error("Formato de resposta inválido do Worker.");
                }

                const validMap = new Map();
                json.rows.forEach(item => {
                    const icao = String(item.icao || "").trim().toUpperCase();
                    if (/^[A-Z]{4}$/.test(icao)) {
                        validMap.set(icao, item);
                    }
                });
                airportData = Array.from(validMap.values());

                const validIcaos = new Set(validMap.keys());
                Object.keys(tafVisibility).forEach(icao => {
                    if (!validIcaos.has(icao)) delete tafVisibility[icao];
                });

                let originText = "Consulta concluída";
                if (json.cacheStatus === "HIT" || json.fromCache === true) {
                    originText = "📦 Dados recuperados do Cache KV";
                } else if (json.cacheStatus === "MISS" || json.fromCache === false) {
                    originText = "⚡ Nova consulta realizada na API";
                }

                let partialInfo = "";
                if (json.apiErrorsCount && json.apiErrorsCount > 0) {
                    partialInfo = ` ⚠️ (Aviso: ${json.apiErrorsCount} falhas parciais em lotes)`;
                }

                const timestampMsg = json.fetchedAt ? `${originText} às ${json.fetchedAt}` : `Atualizado com sucesso`;
                document.getElementById('updateStatus').innerText = `${timestampMsg} — ${airportData.length} aeroportos válidos.${partialInfo}`;
                renderGrid();

            } catch (error) {
                console.error("Falha na atualização:", error);
                const errorReason = error.name === 'AbortError' ? "Tempo limite excedido (Timeout)" : "Falha de rede ou erro na API";
                document.getElementById('updateStatus').innerText = `⚠️ ${errorReason}. Exibindo dados anteriores desta sessão (${airportData.length} aeroportos).`;
            } finally {
                isFetching = false;
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = "🔄 Atualizar Dados";
                }
            }
        }

        function filterGroup(group, btnElement) {
            currentGroup = group;
            updateActiveGroupButton(btnElement);
            renderGrid();
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            updateActiveCategoryButton(btnElement);
            renderGrid();
        }

        function filterAirports() {
            const searchInput = document.getElementById('searchInput');
            currentSearch = searchInput ? searchInput.value.toLowerCase().trim() : '';
            renderGrid();
        }

        function clearAllFilters() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            currentSearch = '';

            currentGroup = 'ALL';
            const groupContainer = document.getElementById('groupFilters');
            if (groupContainer) {
                groupContainer.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                const defaultGroupBtn = groupContainer.querySelector('[data-group="ALL"]');
                if (defaultGroupBtn) defaultGroupBtn.classList.add('active');
            }

            currentCategory = 'ALL';
            const catContainer = document.getElementById('categoryFilters');
            if (catContainer) {
                catContainer.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                const defaultCatBtn = catContainer.querySelector('[data-cat="ALL"]');
                if (defaultCatBtn) defaultCatBtn.classList.add('active');
            }

            renderGrid();
        }

        function updateActiveGroupButton(clickedBtn) {
            if (!clickedBtn) return;
            const container = document.getElementById('groupFilters');
            if (container) {
                container.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            }
            clickedBtn.classList.add('active');
        }

        function updateActiveCategoryButton(clickedBtn) {
            if (!clickedBtn) return;
            const container = document.getElementById('categoryFilters');
            if (container) {
                container.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            }
            clickedBtn.classList.add('active');
        }

        function toggleTaf(icao) {
            tafVisibility[icao] = !tafVisibility[icao];
            renderGrid();
        }

        function formatMetarAge(obsTimeISO) {
            if (!obsTimeISO) return { text: "Horário não informado / Indisponível", isOld: false };
            try {
                const obsDate = new Date(obsTimeISO);
                const now = new Date();
                const diffMs = now - obsDate;
                const diffMins = Math.floor(diffMs / 60000);

                if (isNaN(diffMins) || diffMins < 0) return { text: "Horário inválido", isOld: false };
                if (diffMins < 2) return { text: "Emitido agora mesmo", isOld: false };
                if (diffMins < 60) return { text: `Emitido há ${diffMins} min`, isOld: false };

                const diffHours = Math.floor(diffMins / 60);
                const isOld = diffHours >= 3;
                return { 
                    text: `Emitido há ${diffHours}h ${diffMins % 60}m (${obsDate.toLocaleTimeString('pt-BR', {timeZone: 'UTC'})} UTC)`, 
                    isOld 
                };
            } catch (e) {
                return { text: "Indisponível", isOld: false };
            }
        }

        function renderGrid() {
            const grid = document.getElementById('airportGrid');
            if (!grid) return;
            grid.innerHTML = '';

            let counts = { totalGlobal: airportData.length, vfr: 0, mvfr: 0, ifr: 0, lifr: 0, na: 0, missing: 0 };

            const loadedMap = new Map(airportData.map(item => [String(item.icao).toUpperCase(), item]));

            let workingList = [...airportData];
            if (currentGroup === 'FAVS') {
                favorites.forEach(favCode => {
                    if (!loadedMap.has(favCode)) {
                        workingList.push({
                            icao: favCode,
                            name: "Aeroporto Favoritado (Temporariamente Indisponível)",
                            city: "Aguardando nova consulta na base",
                            country: "—",
                            category: "MISSING",
                            isPlaceholder: true
                        });
                    }
                });
            }

            const filtered = workingList.filter(item => {
                const icao = String(item.icao || '').toUpperCase();
                let matchGroup = true;

                if (currentGroup === 'FAVS') {
                    matchGroup = favorites.includes(icao);
                } else if (currentGroup === 'AIRBASES') {
                    matchGroup = item.isAirBase === true;
                } else if (currentGroup !== 'ALL') {
                    matchGroup = item.group === currentGroup;
                }

                const rawCat = String(item.category || 'N/A').toUpperCase();
                let matchCategory = currentCategory === 'ALL' || rawCat === currentCategory;

                let matchSearch = true;
                if (currentSearch) {
                    const sIcao = icao.includes(currentSearch);
                    const sIata = String(item.iata || '').toLowerCase().includes(currentSearch);
                    const sName = String(item.name || '').toLowerCase().includes(currentSearch);
                    const sCity = String(item.city || '').toLowerCase().includes(currentSearch);
                    matchSearch = sIcao || sIata || sName || sCity;
                }

                return matchGroup && matchCategory && matchSearch;
            });

            // Contabilização estatística rigorosa e separada para ausentes
            filtered.forEach(item => {
                if (item.isPlaceholder) {
                    counts.missing++;
                } else {
                    const cat = String(item.category || 'N/A').toUpperCase();
                    if (cat === 'VFR') counts.vfr++;
                    else if (cat === 'MVFR') counts.mvfr++;
                    else if (cat === 'IFR') counts.ifr++;
                    else if (cat === 'LIFR') counts.lifr++;
                    else counts.na++;
                }
            });

            filtered.sort((a, b) => {
                const aFav = favorites.includes(String(a.icao).toUpperCase()) ? 1 : 0;
                const bFav = favorites.includes(String(b.icao).toUpperCase()) ? 1 : 0;
                return bFav - aFav;
            });

            document.getElementById('statTotalGlobal').textContent = counts.totalGlobal;
            document.getElementById('statTotalFiltered').textContent = filtered.length;
            document.getElementById('statVfr').textContent = counts.vfr;
            document.getElementById('statMvfr').textContent = counts.mvfr;
            document.getElementById('statIfr').textContent = counts.ifr;
            document.getElementById('statLifr').textContent = counts.lifr;
            document.getElementById('statNa').textContent = counts.na;
            document.getElementById('statMissing').textContent = counts.missing;

            if (filtered.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.gridColumn = '1 / -1';
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.color = 'var(--text-secondary)';
                emptyMsg.style.padding = '40px';
                emptyMsg.textContent = 'Nenhum aeroporto encontrado com os filtros e termos de pesquisa atuais.';
                grid.appendChild(emptyMsg);
                return;
            }

            filtered.forEach(item => {
                const icao = String(item.icao || '????').toUpperCase();
                const isFav = favorites.includes(icao);
                const card = document.createElement('div');
                card.className = 'card';

                // ==========================================
                // CARTÃO SEGURO PARA FAVORITOS AUSENTES (SEM XSS)
                // ==========================================
                if (item.isPlaceholder) {
                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'card-header';

                    const titleArea = document.createElement('div');
                    titleArea.className = 'airport-title-area';

                    const favBtn = document.createElement('button');
                    favBtn.className = 'fav-btn favorited';
                    favBtn.title = "Remover dos Favoritos";
                    favBtn.textContent = '★';
                    favBtn.addEventListener('click', (e) => toggleFavorite(icao, e));

                    const titleTextDiv = document.createElement('div');
                    const titleEl = document.createElement('div');
                    titleEl.className = 'airport-title';
                    titleEl.textContent = icao;

                    const subEl = document.createElement('div');
                    subEl.className = 'airport-sub';
                    subEl.textContent = item.name;

                    titleTextDiv.appendChild(titleEl);
                    titleTextDiv.appendChild(subEl);
                    titleArea.appendChild(favBtn);
                    titleArea.appendChild(titleTextDiv);

                    const badgeEl = document.createElement('span');
                    badgeEl.className = 'badge badge-MISSING';
                    badgeEl.textContent = 'AUSENTE';

                    cardHeader.appendChild(titleArea);
                    cardHeader.appendChild(badgeEl);
                    card.appendChild(cardHeader);

                    const msgDiv = document.createElement('div');
                    msgDiv.style.fontSize = '0.85rem';
                    msgDiv.style.color = '#f87171';
                    msgDiv.style.padding = '8px 0';
                    msgDiv.textContent = 'Este aeroporto está nos seus favoritos, mas não foi retornado na última consulta da API. Ele será exibido normalmente assim que estiver disponível.';
                    card.appendChild(msgDiv);

                    grid.appendChild(card);
                    return;
                }

                // ==========================================
                // CARTÃO NORMAL SEGURO
                // ==========================================
                const iata = item.iata ? String(item.iata).toUpperCase() : '';
                const name = String(item.name || 'Aeroporto Desconhecido');
                const city = String(item.city || 'Localidade desconhecida');
                const countryCode = String(item.country || '').toUpperCase();
                const countryName = COUNTRY_NAMES[countryCode] || countryCode || 'Internacional';
                const category = String(item.category || 'N/A').toUpperCase();
                const badgeClass = `badge-${['VFR', 'MVFR', 'IFR', 'LIFR'].includes(category) ? category : 'NA'}`;

                const cardHeader = document.createElement('div');
                cardHeader.className = 'card-header';

                const titleArea = document.createElement('div');
                titleArea.className = 'airport-title-area';

                const favBtn = document.createElement('button');
                favBtn.className = `fav-btn ${isFav ? 'favorited' : ''}`;
                favBtn.setAttribute('aria-label', isFav ? `Remover ${icao} dos favoritos` : `Adicionar ${icao} aos favoritos`);
                favBtn.title = isFav ? "Remover dos Favoritos" : "Adicionar aos Favoritos";
                favBtn.textContent = isFav ? '★' : '☆';
                favBtn.addEventListener('click', (e) => toggleFavorite(icao, e));

                const titleTextDiv = document.createElement('div');
                const titleEl = document.createElement('div');
                titleEl.className = 'airport-title';
                titleEl.textContent = `${icao} ${iata ? '· ' + iata : ''} — ${name}`;

                const subEl = document.createElement('div');
                subEl.className = 'airport-sub';
                subEl.textContent = countryCode ? `${city} — ${countryName} (${countryCode})` : `${city} — Localidade Global`;

                titleTextDiv.appendChild(titleEl);
                titleTextDiv.appendChild(subEl);
                titleArea.appendChild(favBtn);
                titleArea.appendChild(titleTextDiv);

                const badgeEl = document.createElement('span');
                badgeEl.className = `badge ${badgeClass}`;
                badgeEl.textContent = category;

                cardHeader.appendChild(titleArea);
                cardHeader.appendChild(badgeEl);
                card.appendChild(cardHeader);

                if (item.isAirBase) {
                    const tagMil = document.createElement('div');
                    tagMil.className = 'tag-military';
                    tagMil.textContent = '🛡️ Base Aérea Militar / Mista';
                    card.appendChild(tagMil);
                }

                const infoGrid1 = document.createElement('div');
                infoGrid1.className = 'card-info-grid';

                const windItem = document.createElement('div');
                windItem.className = 'info-item';
                const windLabel = document.createElement('span');
                windLabel.className = 'info-label';
                windLabel.textContent = '💨 Vento';
                const windVal = document.createElement('strong');
                windVal.textContent = item.wind || '—';
                windItem.appendChild(windLabel);
                windItem.appendChild(windVal);

                const divider1 = document.createElement('div');
                divider1.className = 'divider';

                const pressItem = document.createElement('div');
                pressItem.className = 'info-item';
                const pressLabel = document.createElement('span');
                pressLabel.className = 'info-label';
                pressLabel.textContent = '⚖️ QNH / Pressão';
                const pressVal = document.createElement('strong');
                pressVal.textContent = item.pressure || '—';
                pressItem.appendChild(pressLabel);
                pressItem.appendChild(pressVal);

                infoGrid1.appendChild(windItem);
                infoGrid1.appendChild(divider1);
                infoGrid1.appendChild(pressItem);
                card.appendChild(infoGrid1);

                const infoGrid2 = document.createElement('div');
                infoGrid2.className = 'card-info-grid';

                const tempItem = document.createElement('div');
                tempItem.className = 'info-item';
                const tempLabel = document.createElement('span');
                tempLabel.className = 'info-label';
                tempLabel.textContent = '🌡️ Temperatura';
                const tempVal = document.createElement('strong');
                tempVal.textContent = (item.temperature && item.temperature.current !== null && item.temperature.current !== undefined) ? `${item.temperature.current}°C` : '—';
                tempItem.appendChild(tempLabel);
                tempItem.appendChild(tempVal);

                const divider2 = document.createElement('div');
                divider2.className = 'divider';

                const dewItem = document.createElement('div');
                dewItem.className = 'info-item';
                const dewLabel = document.createElement('span');
                dewLabel.className = 'info-label';
                dewLabel.textContent = '💧 Ponto de Orvalho';
                const dewVal = document.createElement('strong');
                dewVal.textContent = (item.temperature && item.temperature.dewpoint !== null && item.temperature.dewpoint !== undefined) ? `${item.temperature.dewpoint}°C` : '—';
                dewItem.appendChild(dewLabel);
                dewItem.appendChild(dewVal);

                infoGrid2.appendChild(tempItem);
                infoGrid2.appendChild(divider2);
                infoGrid2.appendChild(dewItem);
                card.appendChild(infoGrid2);

                const infraDiv = document.createElement('div');
                infraDiv.style.fontSize = '0.8rem';
                infraDiv.style.color = 'var(--text-secondary)';
                infraDiv.style.background = 'rgba(15, 23, 42, 0.2)';
                infraDiv.style.padding = '6px 10px';
                infraDiv.style.borderRadius = '6px';

                const runwaysText = (item.runways && item.runways.length > 0) ? item.runways.join(', ') : '—';
                let freqText = "—";
                if (item.frequencies) {
                    let fArr = [];
                    if (item.frequencies.tower) fArr.push(`TWR: ${item.frequencies.tower}`);
                    if (item.frequencies.ground) fArr.push(`GND: ${item.frequencies.ground}`);
                    if (item.frequencies.atis) fArr.push(`ATIS: ${item.frequencies.atis}`);
                    if (item.frequencies.military) fArr.push(`Mil: ${item.frequencies.military}`);
                    if (fArr.length > 0) freqText = fArr.join(" | ");
                }

                const runDiv = document.createElement('div');
                runDiv.textContent = `🛫 Pistas: ${runwaysText}`;
                const freqDiv = document.createElement('div');
                freqDiv.textContent = `📻 Frequências: ${freqText} (Ref: AWC/AIP)`;
                infraDiv.appendChild(runDiv);
                infraDiv.appendChild(freqDiv);
                card.appendChild(infraDiv);

                const metarContainer = document.createElement('div');
                const metarHeader = document.createElement('div');
                metarHeader.className = 'section-header';
                const metarTitle = document.createElement('span');
                metarTitle.className = 'section-title';
                metarTitle.textContent = 'METAR';

                const ageInfo = formatMetarAge(item.observationTime);
                const metarAgeSpan = document.createElement('span');
                metarAgeSpan.style.fontSize = '0.7rem';
                metarAgeSpan.style.color = ageInfo.isOld ? '#f87171' : 'var(--text-secondary)';
                metarAgeSpan.textContent = ageInfo.text;

                metarHeader.appendChild(metarTitle);
                metarHeader.appendChild(metarAgeSpan);

                const metarBox = document.createElement('div');
                metarBox.className = 'metar-box';
                metarBox.textContent = item.metar || 'Relatório METAR indisponível no momento.';

                metarContainer.appendChild(metarHeader);
                metarContainer.appendChild(metarBox);

                if (item.metarInterpret) {
                    const metarInterpEl = document.createElement('div');
                    metarInterpEl.style.fontSize = '0.75rem';
                    metarInterpEl.style.color = '#cbd5e1';
                    metarInterpEl.style.marginTop = '4px';
                    metarInterpEl.textContent = `💡 ${item.metarInterpret}`;
                    metarContainer.appendChild(metarInterpEl);
                }
                card.appendChild(metarContainer);

                const tafContainer = document.createElement('div');
                const tafHeader = document.createElement('div');
                tafHeader.className = 'section-header';
                const tafTitle = document.createElement('span');
                tafTitle.className = 'section-title';
                tafTitle.textContent = 'TAF';

                const isExpanded = !!tafVisibility[icao];
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'toggle-btn';
                toggleBtn.textContent = isExpanded ? 'Recolher' : 'Expandir';
                toggleBtn.addEventListener('click', () => toggleTaf(icao));

                tafHeader.appendChild(tafTitle);
                tafHeader.appendChild(toggleBtn);
                tafContainer.appendChild(tafHeader);

                if (isExpanded) {
                    const tafBox = document.createElement('div');
                    tafBox.className = 'taf-box';
                    tafBox.style.marginTop = '4px';
                    tafBox.textContent = item.taf || 'Previsão TAF indisponível no momento.';
                    tafContainer.appendChild(tafBox);

                    if (item.tafInterpret) {
                        const tafInterpEl = document.createElement('div');
                        tafInterpEl.style.fontSize = '0.75rem';
                        tafInterpEl.style.color = '#d8b4fe';
                        tafInterpEl.style.marginTop = '4px';
                        tafInterpEl.textContent = `💡 ${item.tafInterpret}`;
                        tafContainer.appendChild(tafInterpEl);
                    }
                }
                card.appendChild(tafContainer);

                grid.appendChild(card);
            });
        }

        fetchData();
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
