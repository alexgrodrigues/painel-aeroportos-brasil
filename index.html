<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principais Aeroportos Mercosul V36.7</title>
  <style>
    :root{--bg:#121214;--card:#1a1a1e;--text:#e1e1e6;--muted:#a8a8b3;--accent:#00b37e;--border:#29292e}
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
    .container{max-width:1200px;margin:0 auto}
    h1{margin:0 0 8px;font-size:1.8rem}
    p{margin:0;color:var(--muted)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    .search,select,button{background:#17171b;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit}
    .status{color:var(--muted);margin-bottom:12px}
    .section{margin-bottom:28px}
    .section h2{margin:0 0 12px;font-size:1.2rem;color:#cfd0d6}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .icao{font-size:1.2rem;font-weight:800}
    .badge{padding:4px 8px;border-radius:6px;background:#004835;color:var(--accent);font-weight:700}
    .row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px}
    .label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
    .value{font-weight:600}
    .raw{margin-top:10px;font-size:.82rem;color:var(--muted);word-break:break-word}
    .preview{background:#17171b;border:1px solid var(--border);border-radius:12px;padding:14px;margin:18px 0 24px}
    .preview h3{margin:0 0 8px;font-size:1rem}
    .preview ul{margin:0;padding-left:18px;color:var(--muted)}
  </style>
</head>
<body>
<div class="container">
  <h1>Principais Aeroportos Mercosul V36.7</h1>
  <p></p>
  <div class="toolbar">
    <input id="q" class="search" placeholder="SAEZ, SBSP, IFR">
    <select id="sort"><option value="region">Brasil por região</option><option value="icao">ICAO</option></select>
    <button id="refresh">Atualizar</button>
  </div>
  <div id="status" class="status">Carregando...</div>
  <div id="sections"></div>
</div>
<script>
const WORKER_URL='https://weathered-grass-f181.alexgrodrigues.workers.dev/';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function countryOf(icao){const s=String(icao||'').toUpperCase(); if(s.startsWith('SB')) return 'Brasil'; if(s.startsWith('SA')) return 'Argentina'; if(s.startsWith('SU')) return 'Uruguai'; if(s.startsWith('SG')) return 'Paraguai'; return 'Outros';}
function regionOf(icao){const s=String(icao||'').toUpperCase(); if(['SBPA','SBSM','SBFL','SBCT','SBBG','SBNF','SBPK','SBUG','SBPF','SBCX','SBCH','SBCO'].includes(s)) return 'Sul'; if(['SBSP','SBKP','SBGR','SBGL','SBRJ','SBCF','SBRP'].includes(s)) return 'Sudeste'; if(['SBBR','SBGO','SBCY','SBCG'].includes(s)) return 'Centro-Oeste'; if(['SBFZ','SBNT','SBSV','SBIL','SBPV','SBMA','SBAR','SBMO','SBBE','SBJP','SBRF'].includes(s)) return 'Nordeste'; return 'Norte';}
function card(r){return `<article class="card"><div class="top"><div><div class="icao">${esc(r.icao)}</div><div style="color:var(--muted)">${esc(r.name||'')}</div></div><div class="badge">${esc(r.category||'N/A')}</div></div><div class="row"><div class="box"><span class="label">Vento</span><span class="value">${esc(r.windDirection||'—')}° / ${esc(r.windIntensity||'—')} KT</span></div><div class="box"><span class="label">Pressão</span><span class="value">${esc(r.pressure||'—')}</span></div><div class="box"><span class="label">Temperatura Atual</span><span class="value">${esc(r.temperature?.current ?? '—')}ºC</span></div><div class="box"><span class="label">Ponto de Orvalho</span><span class="value">${esc(r.temperature?.dewpoint ?? '—')}ºC</span></div></div><div class="raw"><strong>METAR:</strong> ${esc(r.metar||'—')}</div><div class="raw"><strong>TAF:</strong> ${esc(r.taf||'—')}</div></article>`}
async function load(){
  try {
    const res = await fetch(WORKER_URL, {cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rows = Array.isArray(data.rows) ? data.rows : [];
    const q = document.getElementById('q').value.trim().toLowerCase();
    let filtered = rows.filter(r => !q || `${r.icao} ${r.name} ${r.city} ${r.state} ${r.category}`.toLowerCase().includes(q));
    const regionGroups = {}, countryGroups = {Argentina:[], Uruguai:[], Paraguai:[]};
    for (const r of filtered) {
      const c = countryOf(r.icao);
      if (c === 'Brasil') (regionGroups[regionOf(r.icao)] ||= []).push(r);
      else if (countryGroups[c]) countryGroups[c].push(r);
    }
    const regionOrder = ['Sul','Sudeste','Centro-Oeste','Nordeste','Norte'];
    const countryOrder = ['Argentina','Uruguai','Paraguai'];
    const regionHtml = regionOrder.filter(k => regionGroups[k] && regionGroups[k].length).map(k => `<section class="section"><h2>Brasil — ${k}</h2><div class="grid">${regionGroups[k].map(card).join('')}</div></section>`).join('');
    const countryHtml = countryOrder.filter(k => countryGroups[k] && countryGroups[k].length).map(k => `<section class="section"><h2>${k}</h2><div class="grid">${countryGroups[k].map(card).join('')}</div></section>`).join('');
    document.getElementById('sections').innerHTML = regionHtml + countryHtml;
    document.getElementById('status').textContent = `Atualizado com ${rows.length} aeroportos`;
  } catch (e) {
    document.getElementById('status').textContent = 'Erro ao carregar dados: ' + e.message;
    document.getElementById('sections').innerHTML = '';
  }
}
document.getElementById('refresh').onclick = load;
document.getElementById('q').oninput = load;
document.getElementById('sort').onchange = load;
load();
</script>
</body>
</html>
