<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principais Aeroportos da América Latina</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --vfr-color: #22c55e;
            --mvfr-color: #3b82f6;
            --ifr-color: #ef4444;
            --lifr-color: #a855f7;
            --na-color: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .version {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-primary);
            width: 280px;
            font-size: 0.95rem;
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        .filter-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .stats span strong {
            color: var(--text-primary);
        }

        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .airport-title {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .airport-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-VFR { background-color: rgba(34, 197, 94, 0.2); color: var(--vfr-color); border: 1px solid var(--vfr-color); }
        .badge-MVFR { background-color: rgba(59, 130, 246, 0.2); color: var(--mvfr-color); border: 1px solid var(--mvfr-color); }
        .badge-IFR { background-color: rgba(239, 68, 68, 0.2); color: var(--ifr-color); border: 1px solid var(--ifr-color); }
        .badge-LIFR { background-color: rgba(168, 85, 247, 0.2); color: var(--lifr-color); border: 1px solid var(--lifr-color); }
        .badge-NA { background-color: rgba(100, 116, 139, 0.2); color: var(--na-color); border: 1px solid var(--na-color); }

        .card-info-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 10px;
            background: rgba(15, 23, 42, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .divider {
            background-color: var(--border-color);
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .metar-box, .taf-box {
            font-family: monospace;
            font-size: 0.78rem;
            background: #0b0f19;
            padding: 8px;
            border-radius: 6px;
            color: #38bdf8;
            word-break: break-all;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .taf-box {
            color: #c084fc;
            border-color: rgba(192, 132, 252, 0.2);
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: bold;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>Principais Aeroportos da América Latina</h1>
        <div class="version">VERSÃO 47</div>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar ICAO, Cidade..." oninput="filterAirports()">
            <button onclick="fetchData()">🔄 Atualizar Dados</button>
        </div>

        <div class="stats" id="statsContainer">
            <span>📊 Total: <strong id="statTotal">0</strong></span>
            <span>🟢 VFR: <strong id="statVfr">0</strong></span>
            <span>🔵 MVFR: <strong id="statMvfr">0</strong></span>
            <span>🔴 IFR: <strong id="statIfr">0</strong></span>
            <span>🟣 LIFR: <strong id="statLifr">0</strong></span>
        </div>

        <div class="filters" id="countryFilters">
            <button class="filter-btn active" onclick="filterCountry('ALL')">🌐 Todos</button>
            <button class="filter-btn" onclick="filterCountry('BR')">🇧🇷 Brasil</button>
            <button class="filter-btn" onclick="filterCountry('AR')">🇦🇷 Argentina</button>
            <button class="filter-btn" onclick="filterCountry('CL')">🇨🇱 Chile</button>
            <button class="filter-btn" onclick="filterCountry('MX')">🇲🇽 México</button>
            <button class="filter-btn" onclick="filterCountry('PA')">🇵🇦 Panamá</button>
            <button class="filter-btn" onclick="filterCountry('CR')">🇨🇷 Costa Rica</button>
            <button class="filter-btn" onclick="filterCountry('OTHER')">🌎 Outros</button>
        </div>

        <div class="filters" id="categoryFilters">
            <button class="filter-btn active" onclick="filterCategory('ALL')">Todas as Condições</button>
            <button class="filter-btn" onclick="filterCategory('VFR')">🟢 VFR (Visual)</button>
            <button class="filter-btn" onclick="filterCategory('MVFR')">🔵 MVFR (Marginal)</button>
            <button class="filter-btn" onclick="filterCategory('IFR')">🔴 IFR (Restrito)</button>
            <button class="filter-btn" onclick="filterCategory('LIFR')">🟣 LIFR (Crítico)</button>
        </div>

        <div id="updateStatus" class="version">Carregando dados meteorológicos...</div>
    </header>

    <main class="grid" id="airportGrid">
        <!-- Os cartões serão injetados dinamicamente via JavaScript -->
    </main>

    <script>
        // ⚠️ COLOQUE AQUI A SUA URL REAL DO CLOUDFLARE WORKER ⚠️
        const WORKER_URL = "https://seu-worker.seu-subdominio.workers.dev";

        let airportData = [];
        let currentCountry = 'ALL';
        let currentCategory = 'ALL';
        let currentSearch = '';

        async function fetchData() {
            document.getElementById('updateStatus').innerText = "Buscando dados atualizados...";
            try {
                const response = await fetch(WORKER_URL);
                const json = await response.json();
                if (json.ok) {
                    airportData = json.rows;
                    document.getElementById('updateStatus').innerText = `Última atualização: ${json.fetchedAt} (${airportData.length} aeroportos carregados)`;
                    renderGrid();
                } else {
                    document.getElementById('updateStatus').innerText = "Erro ao carregar dados do servidor.";
                }
            } catch (error) {
                console.error("Erro de conexão:", error);
                document.getElementById('updateStatus').innerText = "Falha de conexão com o Cloudflare Worker.";
            }
        }

        function filterCountry(country) {
            currentCountry = country;
            updateActiveButtons('countryFilters', event.target);
            renderGrid();
        }

        function filterCategory(category) {
            currentCategory = category;
            updateActiveButtons('categoryFilters', event.target);
            renderGrid();
        }

        function filterAirports() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            renderGrid();
        }

        function updateActiveButtons(containerId, clickedButton) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            clickedButton.classList.add('active');
        }

        function renderGrid() {
            const grid = document.getElementById('airportGrid');
            grid.innerHTML = '';

            let counts = { total: 0, vfr: 0, mvfr: 0, ifr: 0, lifr: 0 };

            const filtered = airportData.filter(item => {
                let matchCountry = true;
                if (currentCountry !== 'ALL') {
                    if (currentCountry === 'OTHER') {
                        matchCountry = item.group === 'OTHER';
                    } else {
                        matchCountry = item.country === currentCountry;
                    }
                }

                let matchCategory = currentCategory === 'ALL' || item.category === currentCategory;

                let matchSearch = !currentSearch || 
                    item.icao.toLowerCase().includes(currentSearch) || 
                    item.name.toLowerCase().includes(currentSearch) || 
                    item.city.toLowerCase().includes(currentSearch);

                return matchCountry && matchCategory && matchSearch;
            });

            airportData.forEach(item => {
                counts.total++;
                if (item.category === 'VFR') counts.vfr++;
                else if (item.category === 'MVFR') counts.mvfr++;
                else if (item.category === 'IFR') counts.ifr++;
                else if (item.category === 'LIFR') counts.lifr++;
            });

            document.getElementById('statTotal').innerText = counts.total;
            document.getElementById('statVfr').innerText = counts.vfr;
            document.getElementById('statMvfr').innerText = counts.mvfr;
            document.getElementById('statIfr').innerText = counts.ifr;
            document.getElementById('statLifr').innerText = counts.lifr;

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">Nenhum aeroporto encontrado com os filtros atuais.</div>';
                return;
            }

            filtered.forEach(item => {
                const badgeClass = `badge-${item.category === 'N/A' ? 'NA' : item.category}`;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="airport-title">${item.icao} — ${item.name}</div>
                            <div class="airport-sub">${item.city} (${item.country})</div>
                        </div>
                        <span class="badge ${badgeClass}">${item.category}</span>
                    </div>

                    <div class="card-info-grid">
                        <div class="info-item">
                            <span class="info-label">💨 Vento</span>
                            <span><strong>${item.wind}</strong></span>
                        </div>
                        <div class="divider"></div>
                        <div class="info-item">
                            <span class="info-label">⚖️ Pressão</span>
                            <span><strong>${item.pressure}</strong></span>
                        </div>
                    </div>

                    <div class="card-info-grid">
                        <div class="info-item">
                            <span class="info-label">🌡️ Temperatura</span>
                            <span><strong>${item.temperature.current !== null ? item.temperature.current + '°C' : '—'}</strong></span>
                        </div>
                        <div class="divider"></div>
                        <div class="info-item">
                            <span class="info-label">💧 Ponto de Orvalho</span>
                            <span><strong>${item.temperature.dewpoint !== null ? item.temperature.dewpoint + '°C' : '—'}</strong></span>
                        </div>
                    </div>

                    <div>
                        <div class="section-title">METAR</div>
                        <div class="metar-box">${item.metar || 'Relatório METAR indisponível no momento.'}</div>
                    </div>

                    <div>
                        <div class="section-title">TAF</div>
                        <div class="taf-box">${item.taf || 'Previsão TAF indisponível no momento.'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        fetchData();
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
