<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principais Aeroportos da América Latina, EUA e Europa</title>
<style>
:root {
--bg-color: #0f172a;
--card-bg: #1e293b;
--text-primary: #f8fafc;
--text-secondary: #94a3b8;
--border-color: #334155;
--vfr-color: #22c55e;
--mvfr-color: #3b82f6;
--ifr-color: #ef4444;
--lifr-color: #a855f7;
--na-color: #64748b;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: var(--bg-color);
color: var(--text-primary);
margin: 0;
padding: 20px;
}

header {
max-width: 1200px;
margin: 0 auto 25px auto;
text-align: center;
}

h1 {
margin-bottom: 5px;
font-size: 1.8rem;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}

.version {
font-size: 0.85rem;
color: var(--text-secondary);
margin-bottom: 15px;
}

.cache-warning-banner {
background-color: rgba(245, 158, 11, 0.15);
border: 1px solid #f59e0b;
color: #fbbf24;
padding: 8px 15px;
border-radius: 8px;
font-size: 0.85rem;
margin-bottom: 15px;
display: none;
align-items: center;
justify-content: center;
gap: 8px;
font-weight: 500;
}

.legend-bar {
display: flex;
flex-wrap: wrap;
gap: 12px;
justify-content: center;
align-items: center;
font-size: 0.78rem;
color: var(--text-secondary);
background: rgba(30, 41, 59, 0.6);
padding: 6px 12px;
border-radius: 6px;
max-width: 650px;
margin: 0 auto 15px auto;
border: 1px solid var(--border-color);
}

.legend-item {
display: flex;
align-items: center;
gap: 4px;
}

.legend-dot {
width: 8px;
height: 8px;
border-radius: 50%;
}

.controls {
display: flex;
flex-wrap: wrap;
gap: 15px;
justify-content: center;
align-items: center;
margin-bottom: 20px;
}

input[type="text"] {
padding: 10px 15px;
border-radius: 8px;
border: 1px solid var(--border-color);
background-color: var(--card-bg);
color: var(--text-primary);
width: 300px;
font-size: 0.95rem;
}

button {
padding: 10px 16px;
border-radius: 8px;
border: none;
background-color: #3b82f6;
color: white;
cursor: pointer;
font-weight: 600;
transition: background 0.2s;
}

button:hover {
background-color: #2563eb;
}

.filters {
display: flex;
flex-wrap: wrap;
gap: 8px;
justify-content: center;
margin-bottom: 15px;
}

.filter-btn {
background-color: var(--card-bg);
color: var(--text-secondary);
border: 1px solid var(--border-color);
padding: 6px 12px;
font-size: 0.85rem;
border-radius: 6px;
cursor: pointer;
transition: background 0.2s, color 0.2s;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
}

.filter-btn.active {
background-color: #3b82f6;
color: white;
border-color: #3b82f6;
}

.stats {
display: flex;
flex-wrap: wrap;
gap: 15px;
justify-content: center;
font-size: 0.9rem;
color: var(--text-secondary);
margin-bottom: 20px;
}

.stats span strong {
color: var(--text-primary);
}

.grid {
max-width: 1200px;
margin: 0 auto;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
gap: 20px;
}

.card {
background-color: var(--card-bg);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 18px;
display: flex;
flex-direction: column;
gap: 14px;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.card-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
}

.airport-title {
font-size: 1.05rem;
font-weight: bold;
}

.airport-codes {
font-size: 0.8rem;
color: #38bdf8;
font-family: monospace;
font-weight: bold;
margin-top: 2px;
}

.airport-sub {
font-size: 0.8rem;
color: var(--text-secondary);
margin-top: 2px;
}

.badge {
padding: 4px 8px;
border-radius: 6px;
font-size: 0.75rem;
font-weight: bold;
text-transform: uppercase;
}

.badge-VFR { background-color: rgba(34, 197, 94, 0.2); color: var(--vfr-color); border: 1px solid var(--vfr-color); }
.badge-MVFR { background-color: rgba(59, 130, 246, 0.2); color: var(--mvfr-color); border: 1px solid var(--mvfr-color); }
.badge-IFR { background-color: rgba(239, 68, 68, 0.2); color: var(--ifr-color); border: 1px solid var(--ifr-color); }
.badge-LIFR { background-color: rgba(168, 85, 247, 0.2); color: var(--lifr-color); border: 1px solid var(--lifr-color); }
.badge-NA { background-color: rgba(100, 116, 139, 0.2); color: var(--na-color); border: 1px solid var(--na-color); }

.card-info-grid {
display: grid;
grid-template-columns: 1fr 1px 1fr;
gap: 10px;
background: rgba(15, 23, 42, 0.4);
padding: 10px;
border-radius: 8px;
font-size: 0.85rem;
}

.divider {
background-color: var(--border-color);
}

.info-item {
display: flex;
flex-direction: column;
gap: 2px;
}

.info-label {
color: var(--text-secondary);
font-size: 0.75rem;
}

.weather-box {
background: #0b0f19;
padding: 10px;
border-radius: 8px;
font-size: 0.78rem;
font-family: monospace;
word-break: break-all;
}

.metar-section {
border-left: 3px solid #38bdf8;
}
.metar-box {
color: #38bdf8;
border: 1px solid rgba(56, 189, 248, 0.2);
}

.interpret-section {
background: rgba(56, 189, 248, 0.08);
border-left: 3px solid #2dd4bf;
padding: 9px 12px;
border-radius: 6px;
font-size: 0.82rem;
color: #2dd4bf;
line-height: 1.4;
}

.taf-raw-box {
color: #c084fc;
border: 1px solid rgba(192, 132, 252, 0.2);
}

.section-title {
font-size: 0.75rem;
font-weight: bold;
margin-bottom: 4px;
text-transform: uppercase;
display: flex;
align-items: center;
justify-content: space-between;
gap: 6px;
}

.title-metar { color: #38bdf8; }
.title-interpret { color: #2dd4bf; }
.title-taf { color: #c084fc; }

.metar-time {
font-size: 0.7rem;
color: var(--text-secondary);
font-family: monospace;
font-weight: normal;
}

details summary {
font-size: 0.75rem;
color: #c084fc;
font-weight: bold;
text-transform: uppercase;
cursor: pointer;
user-select: none;
outline: none;
display: flex;
align-items: center;
gap: 6px;
}

details summary:hover {
opacity: 0.8;
}
</style>
</head>
<body onload="fetchData()">

<header>
<h1>✈️ Principais Aeroportos da América Latina, EUA e Europa</h1>
<div class="version">VERSÃO 71.3</div>

<div id="cacheWarningBanner" class="cache-warning-banner">
  ⚠️ Alguns aeroportos possuem dados meteorológicos com mais de 1 hora de atraso.
</div>

<div class="legend-bar">
<span><strong>Legenda:</strong></span>
<div class="legend-item"><span class="legend-dot" style="background-color: var(--vfr-color);"></span> VFR (Bom)</div>
<div class="legend-item"><span class="legend-dot" style="background-color: var(--mvfr-color);"></span> MVFR (Marginal)</div>
<div class="legend-item"><span class="legend-dot" style="background-color: var(--ifr-color);"></span> IFR (Restrito)</div>
<div class="legend-item"><span class="legend-dot" style="background-color: var(--lifr-color);"></span> LIFR (Crítico)</div>
</div>

<div class="controls">
<input type="text" id="searchInput" placeholder="🔍 Pesquisar ICAO, IATA, Cidade..." oninput="filterAirports()">
<button onclick="fetchData()">🔄 Atualizar Dados</button>
</div>

<div class="stats" id="statsContainer">
<span>📊 Total: <strong id="statTotal">0</strong></span>
<span>🟢 VFR: <strong id="statVfr">0</strong></span>
<span>🔵 MVFR: <strong id="statMvfr">0</strong></span>
<span>🔴 IFR: <strong id="statIfr">0</strong></span>
<span>🟣 LIFR: <strong id="statLifr">0</strong></span>
</div>

<div class="filters" id="countryFilters">
<button class="filter-btn active" data-country="ALL" onclick="filterCountry('ALL')">🌐 Todos</button>
<button class="filter-btn" data-country="BR" onclick="filterCountry('BR')">🇧🇷 Brasil</button>
<button class="filter-btn" data-country="US" onclick="filterCountry('US')">🇺🇸 EUA</button>
<button class="filter-btn" data-country="EU" onclick="filterCountry('EU')">🇪🇺 Europa</button>
<button class="filter-btn" data-country="AR" onclick="filterCountry('AR')">🇦🇷 Argentina</button>
<button class="filter-btn" data-country="CL" onclick="filterCountry('CL')">🇨🇱 Chile</button>
<button class="filter-btn" data-country="MX" onclick="filterCountry('MX')">🇲🇽 México</button>
<button class="filter-btn" data-country="PA" onclick="filterCountry('PA')">🇵🇦 Panamá</button>
<button class="filter-btn" data-country="CR" onclick="filterCountry('CR')">🇨🇷 Costa Rica</button>
<button class="filter-btn" data-country="UY" onclick="filterCountry('UY')">🇺🇾 Uruguai</button>
<button class="filter-btn" data-country="OTHER" onclick="filterCountry('OTHER')">🌎 Outros</button>
</div>

<div class="filters" id="categoryFilters">
<button class="filter-btn active" data-category="ALL" onclick="filterCategory('ALL')">Todas as Condições</button>
<button class="filter-btn" data-category="VFR" onclick="filterCategory('VFR')">🟢 VFR (Visual)</button>
<button class="filter-btn" data-category="MVFR" onclick="filterCategory('MVFR')">🔵 MVFR (Marginal)</button>
<button class="filter-btn" data-category="IFR" onclick="filterCategory('IFR')">🔴 IFR (Restrito)</button>
<button class="filter-btn" data-category="LIFR" onclick="filterCategory('LIFR')">🟣 LIFR (Crítico)</button>
</div>

<div id="updateStatus" class="version">Carregando dados meteorológicos...</div>
</header>

<main class="grid" id="airportGrid">
<!-- Cartões gerados dinamicamente -->
</main>

<script>
const WORKER_URL = "https://weathered-grass-f181.alexgrodrigues.workers.dev";

let airportData = [];
let airportCache = {};
let currentCountry = 'ALL';
let currentCategory = 'ALL';
let currentSearch = '';

async function fetchData() {
document.getElementById('updateStatus').innerText = "Buscando dados atualizados...";
try {
const response = await fetch(WORKER_URL);
const json = await response.json();
if (json.ok) {
let hasOutdatedItems = false;

airportData = json.rows.map(item => {
if ((!item.metar || item.metar === "") && airportCache[item.icao]) {
const cached = airportCache[item.icao];
return {
...item,
metar: cached.metar,
taf: item.taf || cached.taf,
category: cached.category,
wind: cached.wind,
pressure: cached.pressure,
temperature: cached.temperature,
tafInterpret: item.tafInterpret || cached.tafInterpret,
isCached: true
};
}

if (item.metar && item.metar !== "") {
airportCache[item.icao] = item;
}
return item;
});

airportData.forEach(item => {
if (item.metar) {
const ageInfo = parseMetarAge(item.metar);
if (ageInfo.isOutdated) {
hasOutdatedItems = true;
}
}
});

const banner = document.getElementById('cacheWarningBanner');
if (hasOutdatedItems) {
banner.style.display = 'flex';
} else {
banner.style.display = 'none';
}

document.getElementById('updateStatus').innerText = `Última atualização: ${json.fetchedAt} (${airportData.length} aeroportos carregados)`;
renderGrid();
} else {
document.getElementById('updateStatus').innerText = "Erro ao carregar dados do servidor.";
}
} catch (error) {
console.error("Erro de conexão:", error);
document.getElementById('updateStatus').innerText = "Falha de conexão com o Cloudflare Worker.";
}
}

function parseMetarAge(metarStr) {
if (!metarStr) return { text: "", isOutdated: false };
const match = metarStr.match(/\b(\d{2})(\d{2})(\d{2})Z\b/);
if (!match) return { text: "", isOutdated: false };

const day = parseInt(match[1], 10);
const hour = parseInt(match[2], 10);
const minute = parseInt(match[3], 10);

const now = new Date();
const metarDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), day, hour, minute));
let diffMs = now - metarDate;

if (diffMs < 0) {
return { text: `Emitido às ${match[2]}:${match[3]}Z`, isOutdated: false };
}

const diffMins = Math.floor(diffMs / (1000 * 60));
const diffHours = Math.floor(diffMins / 60);
const remMins = diffMins % 60;

const isOutdated = diffMins > 60;

let text = "";
if (diffMins < 60) {
text = `Atualizado há ${diffMins} min`;
} else {
text = `⚠️ Desatualizado (${diffHours}h ${remMins}m atrás)`;
}

return { text, isOutdated };
}

function syncActiveButtons() {
document.querySelectorAll('#countryFilters .filter-btn').forEach(btn => {
if (btn.getAttribute('data-country') === currentCountry) {
btn.classList.add('active');
} else {
btn.classList.remove('active');
}
});

document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => {
if (btn.getAttribute('data-category') === currentCategory) {
btn.classList.add('active');
} else {
btn.classList.remove('active');
}
});
}

function filterCountry(country) {
currentCountry = country;
syncActiveButtons();
renderGrid();
}

function filterCategory(category) {
currentCategory = category;
syncActiveButtons();
renderGrid();
}

function filterAirports() {
currentSearch = document.getElementById('searchInput').value.toLowerCase();
renderGrid();
}

function renderCardHeader(item) {
const badgeClass = `badge-${item.category === 'N/A' ? 'NA' : item.category}`;
const iataDisplay = item.iata ? item.iata : '<span style="color: var(--text-secondary); font-weight: normal;">sem IATA</span>';

return `
<div class="card-header">
<div>
<div class="airport-title">${item.name}</div>
<div class="airport-codes">ICAO: ${item.icao} &bull; IATA: ${iataDisplay}</div>
<div class="airport-sub">${item.city} (${item.country})</div>
</div>
<span class="badge ${badgeClass}">${item.category}</span>
</div>
`;
}

function renderGrid() {
syncActiveButtons();

const grid = document.getElementById('airportGrid');
grid.innerHTML = '';

let counts = { total: 0, vfr: 0, mvfr: 0, ifr: 0, lifr: 0 };

const filtered = airportData.filter(item => {
let matchCountry = true;
if (currentCountry !== 'ALL') {
if (currentCountry === 'OTHER') {
matchCountry = item.group === 'OTHER';
} else if (currentCountry === 'EU') {
matchCountry = item.group === 'EU';
} else {
matchCountry = item.country === currentCountry;
}
}

let matchCategory = currentCategory === 'ALL' || item.category === currentCategory;

let matchSearch = !currentSearch ||
item.icao.toLowerCase().includes(currentSearch) ||
(item.iata && item.iata.toLowerCase().includes(currentSearch)) ||
item.name.toLowerCase().includes(currentSearch) ||
item.city.toLowerCase().includes(currentSearch);

return matchCountry && matchCategory && matchSearch;
});

airportData.forEach(item => {
counts.total++;
if (item.category === 'VFR') counts.vfr++;
else if (item.category === 'MVFR') counts.mvfr++;
else if (item.category === 'IFR') counts.ifr++;
else if (item.category === 'LIFR') counts.lifr++;
});

document.getElementById('statTotal').innerText = counts.total;
document.getElementById('statVfr').innerText = counts.vfr;
document.getElementById('statMvfr').innerText = counts.mvfr;
document.getElementById('statIfr').innerText = counts.ifr;
document.getElementById('statLifr').innerText = counts.lifr;

if (filtered.length === 0) {
grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">Nenhum aeroporto encontrado com os filtros atuais.</div>';
return;
}

filtered.forEach(item => {
const ageInfo = parseMetarAge(item.metar);
const card = document.createElement('div');
card.className = 'card';
card.innerHTML = `
${renderCardHeader(item)}

<div class="card-info-grid">
<div class="info-item">
<span class="info-label">💨 Vento</span>
<span><strong>${item.wind}</strong></span>
</div>
<div class="divider"></div>
<div class="info-item">
<span class="info-label">⚖️ Pressão</span>
<span><strong>${item.pressure}</strong></span>
</div>
</div>

<div class="card-info-grid">
<div class="info-item">
<span class="info-label">🌡️ Temperatura</span>
<span><strong>${item.temperature && item.temperature.current !== null ? item.temperature.current + '°C' : '—'}</strong></span>
</div>
<div class="divider"></div>
<div class="info-item">
<span class="info-label">💧 Ponto de Orvalho</span>
<span><strong>${item.temperature && item.temperature.dewpoint !== null ? item.temperature.dewpoint + '°C' : '—'}</strong></span>
</div>
</div>

<div class="metar-section">
<div class="section-title title-metar">
<span>📡 METAR (Condição Atual)</span>
<span class="metar-time">${ageInfo.text}</span>
</div>
<div class="weather-box metar-box">${item.metar || "METAR indisponível"}</div>
</div>

<div>
<div class="section-title title-interpret">💡 Interpretação da Previsão</div>
${item.tafInterpret ? `<div class="interpret-section" style="margin-bottom: 8px;">${item.tafInterpret}</div>` : '<div class="interpret-section">Nenhuma interpretação disponível.</div>'}

<details style="margin-top: 6px;">
<summary>⏱️ Ver TAF Bruto (Técnico)</summary>
<div class="weather-box taf-raw-box" style="margin-top: 6px;">${item.taf || "TAF indisponível"}</div>
</details>
</div>
`;
grid.append(card);
});
}
</script>
</body>
</html>
