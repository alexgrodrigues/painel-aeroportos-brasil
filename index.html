<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista responsiva de aeroportos</title>
  <style>
    :root{--bg:#171510;--card:#221f19;--line:#3a342a;--text:#f3eee7;--muted:#c8bfb1;--accent:#8ac6ff;--bad:#d98f8f;--good:#a3d38a}
    body{margin:0;background:linear-gradient(180deg,#191612,#120f0c);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    .hero,.panel,.item{background:rgba(34,31,25,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 22px rgba(0,0,0,.22)}
    .hero{padding:20px;margin-bottom:16px}
    h1{margin:.2rem 0 0;font-size:clamp(1.8rem,4vw,3rem)}
    .muted{color:var(--muted)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
    input,button,select{background:#1a1713;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit}
    button{cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
    .item{padding:16px}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .code{font-weight:800;font-size:1.2rem}
    .cat{padding:6px 10px;border-radius:999px;background:#2b3a1f;color:var(--good);font-weight:700;font-size:.9rem}
    .cat.ifr{background:#3d2025;color:#ef9ea1}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0 10px}
    .stat{background:#1a1713;border:1px solid var(--line);border-radius:16px;padding:14px}
    .label{color:var(--muted);font-size:.95rem}
    .value{font-size:1.1rem;font-weight:800;margin-top:4px}
    .raw{background:#1d1a16;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;overflow:auto}
    .small{font-size:.95rem}
    .link{color:var(--accent);text-decoration:none}
    .version{opacity:.8;font-size:.95rem}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="muted">BRASIL · METAR EM TEMPO REAL <span class="version">v26</span></div>
    <h1>Lista responsiva de aeroportos</h1>
    <p class="muted">Somente aeroportos disponíveis no momento, com bloco interpretado e raw.</p>
    <div class="toolbar">
      <input id="q" placeholder="Ex.: SBSP, Recife, BKN">
      <select id="sort"><option value="cat">Pior categoria primeiro</option><option value="name">Nome</option></select>
      <button id="refresh">Atualizar</button>
      <button id="theme">Tema</button>
    </div>
    <div id="status" class="muted">Carregando...</div>
  </div>

  <div class="panel" style="padding:16px">
    <div class="stats">
      <div class="stat"><div class="label">Aerportos online</div><div class="value" id="nOnline">0</div></div>
      <div class="stat"><div class="label">Com TAF</div><div class="value" id="nTaf">0</div></div>
      <div class="stat"><div class="label">IFR/LIFR</div><div class="value" id="nIfr">0</div></div>
      <div class="stat"><div class="label">Versão</div><div class="value">v26</div></div>
    </div>
    <div class="grid" id="list"></div>
  </div>
</div>
<script>
const WORKER_URL = 'COLE_AQUI_A_URL_DO_SEU_WORKER';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function parseWind(metar){const s=String(metar||'').replace(/\s+/g,' ').trim();const m=s.match(/((?:\d{3}|VRB)\d{2,3}(?:G\d{2,3})?KT)/);if(m)return m[1];const m2=s.match(/((?:\d{3}|VRB)\d{2,3}(?:G\d{2,3})?MPS)/);if(m2)return m2[1];return '—'}
function parseVisibility(metar){const s=String(metar||'').replace(/\s+/g,' ').trim();const m=s.match(/(9999|P6SM|\d{4})/);return m?m[1]:'—'}
function parseCeiling(metar){const s=String(metar||'').replace(/\s+/g,' ').trim();const m=s.match(/(?:BKN|OVC)(\d{3})/);return m?`${m[1]} ft`:'—'}
function parseTemperature(metar){const s=String(metar||'').replace(/\s+/g,' ').trim();const m=s.match(/(M?\d{2})\/(M?\d{2})/);return m?`${m[1].replace('M','-')}/${m[2].replace('M','-')} °C`:'—'}
function parseCat(v){if(!v)return 'N/A';const n=String(v).replace('+','');if(v==='LIFR'||v==='IFR'||v==='MVFR'||v==='VFR') return v;return 'N/A'}
function windDebug(metar){return String(metar||'').match(/(?:\d{3}|VRB)\d{2,3}(?:G\d{2,3})?KT/)?.[0] || String(metar||'').match(/(?:\d{3}|VRB)\d{2,3}(?:G\d{2,3})?MPS/)?.[0] || '—'}
function renderItem(r){const wind=parseWind(r.metar); const visibility=parseVisibility(r.metar); const ceiling=parseCeiling(r.metar); const temp=parseTemperature(r.metar); const cat=parseCat(r.category||r.cat);
  return `<article class="item">
    <div class="top"><div><div class="code">${esc(r.icao)}</div><div class="muted">${esc(r.name||'')}</div></div><div class="cat ${cat==='IFR'||cat==='LIFR'?'ifr':''}">${esc(cat)}</div></div>
    <div class="stats">
      <div class="stat"><div class="label">Vento</div><div class="value">${esc(wind)}</div></div>
      <div class="stat"><div class="label">Visibilidade</div><div class="value">${esc(visibility)}</div></div>
      <div class="stat"><div class="label">Teto</div><div class="value">${esc(ceiling)}</div></div>
      <div class="stat"><div class="label">Temperatura</div><div class="value">${esc(temp)}</div></div>
    </div>
    <div class="muted small"><strong>METAR interpretado:</strong> vento ${esc(wind)} · ${esc(visibility)} · ${esc(ceiling)} · ${esc(temp)}</div>
    <div class="muted small"><strong>Vento raw:</strong> ${esc(windDebug(r.metar))}</div>
    <div class="muted small"><strong>Wind debug:</strong> ${esc(windDebug(r.metar))}</div>
    <div class="raw small"><strong>METAR raw:</strong>
${esc(r.metar||'—')}</div>
    <div style="margin-top:10px" class="muted small"><strong>TAF interpretado:</strong> ${esc(r.tafInterpret||'Sem TAF disponível.')}</div>
    <div class="muted small"><strong>TEND.:</strong> ${esc(r.tafTrend||'sem grupos de tendência relevantes')}</div>
    <div class="muted small"><strong>Alerta TAF:</strong> ${esc(r.tafAlert||'sem indicação forte de piora')}</div>
    ${r.taf?`<div class="raw small" style="margin-top:10px"><strong>TAF raw:</strong>
${esc(r.taf)}</div>`:''}
  </article>`}
async function load(){
  try{
    $('status').textContent='Carregando dados...';
    const res=await fetch(WORKER_URL,{cache:'no-store',mode:'cors'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const rows=(data.rows||data||[]).map(r=>({
      icao:r.icao||r.ICAO||r.station||'',
      name:r.name||r.city||r.nome||'',
      category:r.category||r.cat||r.classification||'',
      metar:r.metar||r.METAR||r.raw_metar||r.raw||'',
      taf:r.taf||r.TAF||r.raw_taf||'',
      tafInterpret:r.tafInterpret||r.tafSummary||'',
      tafTrend:r.tafTrend||r.tend||'',
      tafAlert:r.tafAlert||''
    }));
    const q=$('q').value.trim().toLowerCase();
    let filtered=rows.filter(r=>!q||`${r.icao} ${r.name} ${r.category}`.toLowerCase().includes(q));
    if($('sort').value==='name') filtered.sort((a,b)=>a.icao.localeCompare(b.icao));
    else filtered.sort((a,b)=>(['LIFR','IFR','MVFR','VFR'].indexOf(a.category)-['LIFR','IFR','MVFR','VFR'].indexOf(b.category)));
    $('list').innerHTML=filtered.map(renderItem).join('');
    $('nOnline').textContent=rows.length;
    $('nTaf').textContent=rows.filter(r=>r.taf).length;
    $('nIfr').textContent=rows.filter(r=>r.category==='IFR'||r.category==='LIFR').length;
    $('status').textContent=`Atualizado com ${rows.length} aeroportos`;
  }catch(e){$('status').textContent='Erro ao carregar dados: '+e.message;}
}
$('refresh').onclick=load;$('theme').onclick=()=>document.body.classList.toggle('light');$('q').oninput=load;$('sort').onchange=load;load();
</script>
</body>
</html>
