<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Principais Aeroportos Mercosul</title>
<style>
:root{--bg:#121214;--card:#1a1a1e;--text:#e1e1e6;--muted:#a8a8b3;--accent:#00b37e;--border:#29292e}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
.container{max-width:1280px;margin:0 auto}

header {text-align: center; margin-bottom: 25px; margin-top: 15px; display:flex; flex-direction:column; align-items:center;}
header h1 {margin: 0; font-size: 1.85rem; color: #e1e1e6;}
header span {font-size: 0.85rem; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top:6px;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 20px}
.search,select,button{background:#17171b;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit}

button#refresh {
  transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease;
  cursor: pointer;
}
button#refresh:active, button#refresh.pressionado {
  transform: scale(0.92);
  filter: brightness(0.85);
}
button#refresh.carregando {
  opacity: 0.7;
  pointer-events: none;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 24px;
  font-size: 0.85rem;
  color: var(--muted);
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.section{margin:0 0 28px}
.section h2{margin:0 0 14px;font-size:1.2rem;color:#cfd0d6;border-left:4px solid var(--accent);padding-left:8px;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  position:relative;
  overflow:hidden;
  transition: border-color 0.2s ease;
}
.card:hover {
  border-color: #3f3f46;
}

/* Cores padronizadas para as Categorias de Voo */
.card-op{padding:4px 10px;border-radius:999px;font-weight:700;font-size:.78rem;flex:0 0 auto;letter-spacing:0.5px;}
.cat-vfr{background:rgba(0,179,126,0.15);color:#00b37e;border:1px solid rgba(0,179,126,0.3);}
.cat-mvfr{background:rgba(49,130,206,0.15);color:#63b3ed;border:1px solid rgba(49,130,206,0.3);}
.cat-ifr{background:rgba(229,62,62,0.15);color:#fc8181;border:1px solid rgba(229,62,62,0.3);}
.cat-lifr{background:rgba(159,122,234,0.15);color:#d6bcfa;border:1px solid rgba(159,122,234,0.3);}
.cat-na{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);}

/* Alerta Severo com animação de pulso sutil */
.card.alerta-severo {
  border: 1px solid #e53e3e !important;
  background: linear-gradient(180deg, #1a1a1e 0%, #2c1a1a 100%);
  animation: pulse-border 2s infinite;
}
@keyframes pulse-border {
  0% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.4); }
  70% { box-shadow: 0 0 0 6px rgba(229, 62, 62, 0); }
  100% { box-shadow: 0 0 0 0 rgba(229, 62, 62, 0); }
}

.card-header{margin-bottom:12px}
.card-header h2{margin:0;font-size:1.55rem;line-height:1.1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:none;padding:0;}
.card-city{font-size:.9rem;color:#a8a8b3;font-weight:600}
.card-country{font-size:.8rem;color:#8b8b97;margin-top:2px}
.card-name{font-size:.75rem;color:#737380;margin-top:8px;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:10px}
.label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.value{font-weight:600;font-size:0.9rem;}

.raw{margin-top:12px;font-size:.8rem;color:var(--muted);word-break:break-word;background:rgba(0,0,0,0.2);padding:8px 10px;border-radius:6px;border-left:2px solid var(--border);}

@media (max-width:640px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
      <h1>Principais Aeroportos do Mercosul</h1>
      <span>Versão 39.0</span>
  </header>
  <div class="toolbar">
    <input id="q" class="search" placeholder="Pesquisar SAEZ, SBSP, IFR...">
    <select id="sort"><option value="region">Brasil por região</option><option value="icao">ICAO</option></select>
    <button id="refresh">Atualizar</button>
  </div>
  
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span id="status">Carregando dados meteorológicos...</span>
    </div>
    <div id="cacheinfo"></div>
  </div>

  <div id="sections"></div>
</div>
<script>
const WORKER_URL='https://weathered-grass-f181.alexgrodrigues.workers.dev/';
const TIMEOUT_MS=12000;
const infoAeroportos={SAEZ:{cidade:'Buenos Aires, Argentina',nome:'Aeroporto Internacional Ministro Pistarini (Ezeiza)'},SABE:{cidade:'Buenos Aires, Argentina',nome:'Aeroparque Jorge Newbery'},SAWH:{cidade:'Ushuaia, Argentina',nome:'Aeroporto Intl. de Ushuaia - Malvinas Argentinas'},SUMU:{cidade:'Montevidéu, Uruguai',nome:'Aeroporto Internacional de Carrasco'},SGAS:{cidade:'Luque, Assunção, Paraguai',nome:'Aeroporto Internacional Silvio Pettirossi'},SBGR:{cidade:'Guarulhos, SP',nome:'Aeroporto Internacional Governador André Franco Montoro'},SBCO:{cidade:'Canoas, RS',nome:'Base Aérea de Canoas'},SBCH:{cidade:'Chapecó, SC',nome:'Aeroporto Serafim Enoss Bertaso'},SBPA:{cidade:'Porto Alegre, RS',nome:'Aeroporto Internacional Salgado Filho'},SBSM:{cidade:'Santa Maria, RS',nome:'Aeroporto de Santa Maria'},SBFL:{cidade:'Florianópolis, SC',nome:'Aeroporto Internacional Hercílio Luz'},SBPE:{cidade:'Petrolina, PE',nome:'Aeroporto de Petrolina - Senador Nilo Coelho'},SBCT:{cidade:'Curitiba, PR',nome:'Aeroporto Internacional Afonso Pena'},SBFI:{cidade:'Foz do Iguaçu, PR',nome:'Aeroporto Internacional de Foz do Iguaçu - Cataratas'},SBKP:{cidade:'Campinas, SP',nome:'Aeroporto Internacional de Viracopos'},SBSP:{cidade:'São Paulo, SP',nome:'Aeroporto de Congonhas'},SBGL:{cidade:'Rio de Janeiro, RJ',nome:'Aeroporto Internacional do Galeão - Tom Jobim'},SBRJ:{cidade:'Rio de Janeiro, RJ',nome:'Aeroporto Santos Dumont'},SBBR:{cidade:'Brasília, DF',nome:'Aeroporto Internacional de Brasília - Presidente Juscelino Kubitschek'},SBCF:{cidade:'Confins, MG',nome:'Aeroporto Internacional Tancredo Neves'},SBSV:{cidade:'Salvador, BA',nome:'Aeroporto Internacional de Salvador - Deputado Luís Eduardo Magalhães'},SBRF:{cidade:'Recife, PE',nome:'Aeroporto Internacional do Recife - Guararapes'},SBJP:{cidade:'João Pessoa, PB',nome:'Aeroporto Internacional Presidente Castro Pinto'},SBBE:{cidade:'Belém, PA',nome:'Aeroporto Internacional de Belém - Val-de-Cans'},SBNF:{cidade:'Navegantes, SC',nome:'Aeroporto Internacional de Navegantes'},SBPK:{cidade:'Pelotas, RS',nome:'Aeroporto Internacional de Pelotas'},SBUG:{cidade:'Bagé, RS',nome:'Aeroporto Comandante Gustavo Kraemer'},SBPF:{cidade:'Passo Fundo, RS',nome:'Aeroporto Lauro Kurtz'},SBCX:{cidade:'Caxias do Sul, RS',nome:'Aeroporto Hugo Cantergiani'},SBFZ:{cidade:'Fortaleza, CE',nome:'Aeroporto Internacional Pinto Martins'},SBNT:{cidade:'Natal, RN',nome:'Aeroporto Internacional de Natal - Augusto Severo'},SBRP:{cidade:'Ribeirão Preto, SP',nome:'Aeroporto Leite Lopes'},SBMA:{cidade:'Marabá, PA',nome:'Aeroporto João Corrêa da Rocha'},SBAR:{cidade:'Aracaju, SE',nome:'Aeroporto Santa Maria'},SBMO:{cidade:'Maceió, AL',nome:'Aeroporto Internacional Zumbi dos Palmares'},SBMQ:{cidade:'Macapá, AP',nome:'Aeroporto Internacional de Macapá'},SBSN:{cidade:'Santarém, PA',nome:'Aeroporto Internacional Maestro Wilson Fonseca'},SBPV:{cidade:'Porto Velho, RO',nome:'Aeroporto Internacional Governador Jorge Teixeira'},SBVH:{cidade:'Vilhena, RO',nome:'Aeroporto Brigadeiro Camarão'},SBGO:{cidade:'Goiânia, GO',nome:'Aeroporto Santa Genoveva'},SBCY:{cidade:'Várzea Grande, MT',nome:'Aeroporto Internacional Marechal Rondon'},SBCG:{cidade:'Campo Grande, MS',nome:'Aeroporto Internacional de Campo Grande'},SBEG:{cidade:'Manaus, AM',nome:'Aeroporto Internacional Eduardo Gomes'},SBSG:{cidade:'São Gonçalo do Amarante, RN',nome:'São Gonçalo do Amarante - Governador Aluízio Alves (Natal)'},SBTE:{cidade:'Teresina, PI',nome:'Aeroporto de Teresina - Senador Petrônio Portela'}};

function esc(s){return String(s==null?'':s).replace(/[&<>"]|'/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function countryOf(icao){const s=String(icao||'').toUpperCase();if(s.startsWith('SB'))return 'Brasil';if(s.startsWith('SA'))return 'Argentina';if(s.startsWith('SU'))return 'Uruguai';if(s.startsWith('SG'))return 'Paraguai';return 'Outros';}
function regionOf(icao){const s=String(icao||'').toUpperCase();if(['SBPA','SBSM','SBFL','SBCT','SBBG','SBNF','SBPK','SBUG','SBPF','SBCX','SBCH','SBCO','SBFI'].includes(s))return 'Sul';if(['SBSP','SBKP','SBGR','SBGL','SBRJ','SBCF','SBRP'].includes(s))return 'Sudeste';if(['SBBR','SBGO','SBCY','SBCG'].includes(s))return 'Centro-Oeste';if(['SBFZ','SBSG','SBSV','SBIL','SBPE','SBJP','SBRF','SBTE','SBMA','SBAR','SBMO','SBNT'].includes(s))return 'Nordeste';return 'Norte';}

function getCategoryClass(cat){
  const v = String(cat||'').toUpperCase().trim();
  if(v === 'VFR') return 'cat-vfr';
  if(v === 'MVFR') return 'cat-mvfr';
  if(v === 'IFR') return 'cat-ifr';
  if(v === 'LIFR') return 'cat-lifr';
  return 'cat-na';
}

function card(r){
  const info=infoAeroportos[r.icao]||{};
  const cidade=info.cidade||'Localidade não informada';
  const nome=info.nome||'Aeroporto não identificado';
  const tag=r.category||'N/A';
  const catClass=getCategoryClass(tag);
  const country=cidade.includes(',')?cidade.split(',').slice(1).join(',').trim():'País não informado';
  const windTxt=(r.windDirection && r.windDirection!=='—' && r.windIntensity && r.windIntensity!=='—') ? (esc(r.windDirection) + '° / ' + esc(r.windIntensity) + ' KT') : '—';
  const metarTxt=(r.metar ?? r.rawMetar ?? r.metarText ?? '—');
  const tafTxt=(r.taf ?? r.rawTaf ?? r.tafText ?? '—');
  const pressTxt=(r.pressure && r.pressure!=='—') ? esc(r.pressure) : '—';
  const tempTxt=(r.temperature && r.temperature.current && r.temperature.current!=='—') ? esc(r.temperature.current) + '°C' : '—';
  const dewTxt=(r.temperature && r.temperature.dewpoint && r.temperature.dewpoint!=='—') ? esc(r.temperature.dewpoint) + '°C' : '—';
  const tafTexto=String(tafTxt).toUpperCase();
  const temAlertaSevero=tafTexto.includes('TS') || tafTexto.includes('FG') || tafTexto.includes('0300') || tafTexto.includes('0500') || tafTexto.includes('VV001');
  const classeCard=temAlertaSevero ? 'card alerta-severo' : 'card';
  
  let tafInterpHtml='';
  if(tafTxt && tafTxt!=='—'){
    const baseTxt=r.tafInterpret || 'Sem previsão base detalhada';
    const trends=(r.tafTrend && r.tafTrend!=='sem grupos de tendência relevantes') ? r.tafTrend.split('|').map(t=>t.trim()) : [];
    let evolucoesHtml='';
    if(trends.length>0){
      evolucoesHtml='<h5 style="color: #8d8d99; margin: 10px 0 6px 0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;">Evoluções Previstas</h5><div style="display: flex; flex-direction: column; gap: 6px;">';
      trends.forEach(trend=>{
        let color='#8d8d99';
        if(trend.startsWith('BECMG')) color='#f6ad55';
        else if(trend.startsWith('TEMPO')) color='#63b3ed';
        else if(trend.startsWith('PROB')) color='#9f7aea';
        else if(trend.startsWith('FM')) color='#fc8181';
        const match=trend.match(/^(BECMG|TEMPO|PROB\d{2}|FM\d{6})\s+([\d\/]+)(.*)/);
        let formatted=esc(trend);
        if(match){
          formatted='<strong style="color: #e1e1e6;">'+match[1]+' ('+match[2]+'):</strong> '+esc(match[3].trim());
        }else{
          const space=trend.indexOf(' ');
          if(space>0) formatted='<strong style="color: #e1e1e6;">'+esc(trend.substring(0, space))+':</strong> '+esc(trend.substring(space+1));
        }
        evolucoesHtml+='<div style="padding-left: 8px; border-left: 3px solid '+color+'; font-size: 0.75rem; color: #a8a8b3;">'+formatted+'</div>';
      });
      evolucoesHtml+='</div>';
    }
    tafInterpHtml='<div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;"><h4 style="color: #e1e1e6; margin: 0 0 8px 0; font-size: 0.8rem; display: flex; align-items: center; gap: 5px;">📋 TAF Interpretado</h4><div style="font-size: 0.78rem; color: #a8a8b3; margin-bottom: 6px; line-height: 1.4;"><span style="color: #00b37e;">🌤️</span> <strong>Base:</strong> '+esc(baseTxt)+'</div>'+evolucoesHtml+'</div>';
  }

  return '<article class="'+classeCard+'">'+
    '<div class="card-header">'+
      '<h2><span>'+esc(r.icao)+'</span><span class="card-op '+catClass+'">'+esc(tag)+'</span></h2>'+
      '<div class="card-city">'+esc(cidade.split(',')[0])+'</div>'+
      '<div class="card-country">'+esc(country)+'</div>'+
      '<div class="card-name">'+esc(nome)+'</div>'+
    '</div>'+
    '<div class="row">'+
      '<div class="box"><span class="label">💨 Vento</span><span class="value">'+windTxt+'</span></div>'+
      '<div class="box"><span class="label">⚖️ Pressão</span><span class="value">'+pressTxt+'</span></div>'+
      '<div class="box"><span class="label">🌡️ Temperatura</span><span class="value">'+tempTxt+'</span></div>'+
      '<div class="box"><span class="label">💧 Ponto de Orvalho</span><span class="value">'+dewTxt+'</span></div>'+
    '</div>'+
    '<div class="raw" style="margin-top: 12px;"><strong>METAR:</strong> '+esc(metarTxt)+'</div>'+
    '<div class="raw" style="margin-top: 6px;"><strong>TAF:</strong> '+esc(tafTxt)+'</div>'+
    tafInterpHtml+
  '</article>';
}

async function load(){
  try{
    const btn=document.getElementById('refresh');
    btn.classList.add('carregando');
    const controller=new AbortController();
    const t=setTimeout(()=>controller.abort(),TIMEOUT_MS);
    const res=await fetch(WORKER_URL+'?t='+Date.now(),{cache:'no-store',signal:controller.signal});
    clearTimeout(t);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const rows=Array.isArray(data.rows)?data.rows:[];
    const q=document.getElementById('q').value.trim().toLowerCase();
    const filtered=rows.filter(r=>!q||((r.icao||'')+' '+(r.name||'')+' '+(r.city||'')+' '+(r.state||'')+' '+(r.category||'')).toLowerCase().includes(q));
    const regionGroups={},countryGroups={Argentina:[],Uruguai:[],Paraguai:[]};
    for(const r of filtered){
      const c=countryOf(r.icao);
      if(c==='Brasil')(regionGroups[regionOf(r.icao)]||(regionGroups[regionOf(r.icao)]=[])).push(r);
      else if(countryGroups[c])countryGroups[c].push(r);
    }
    const regionOrder=['Sul','Sudeste','Centro-Oeste','Nordeste','Norte'];
    const countryOrder=['Argentina','Uruguai','Paraguai'];
    const regionHtml=regionOrder.filter(function(k){return regionGroups[k]&&regionGroups[k].length;}).map(function(k){return '<section class="section"><h2>Brasil — '+k+'</h2><div class="grid">'+regionGroups[k].map(card).join('')+'</div></section>';}).join('');
    const countryHtml=countryOrder.filter(function(k){return countryGroups[k]&&countryGroups[k].length;}).map(function(k){return '<section class="section"><h2>'+k+'</h2><div class="grid">'+countryGroups[k].map(card).join('')+'</div></section>';}).join('');
    document.getElementById('sections').innerHTML=regionHtml+countryHtml;
    const ageMin=data.updatedAt?Math.max(0,Math.round((Date.now()-new Date(data.updatedAt).getTime())/60000)):null;
    document.getElementById('status').textContent='Atualizado com '+rows.length+' aeroportos';
    document.getElementById('cacheinfo').textContent='Cache: '+(res.headers.get('X-Cache')||'—')+(ageMin!==null?' · há '+ageMin+' min':'');
  }catch(e){
    document.getElementById('status').textContent='Erro ao carregar dados: '+e.message;
    document.getElementById('cacheinfo').textContent='';
    document.getElementById('sections').innerHTML='';
  }finally{
    const btn=document.getElementById('refresh');
    btn.classList.remove('carregando');
  }
}

document.getElementById('refresh').onclick=function(){
  const btn=this;
  btn.classList.add('pressionado');
  setTimeout(()=>btn.classList.remove('pressionado'),150);
  load();
};
document.getElementById('q').oninput=load;
document.getElementById('sort').onchange=load;
load();
</script>
</body>
</html>
