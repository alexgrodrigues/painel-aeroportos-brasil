<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Aeroportos Brasil v33</title>
  <style>
    :root{--bg:#121214;--card:#1a1a1e;--text:#e1e1e6;--muted:#a8a8b3;--accent:#00b37e;--border:#29292e}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
    .container{max-width:1200px;margin:0 auto}
    header{margin-bottom:24px}
    header h1{font-size:1.8rem;margin:0 0 8px}
    header p{color:var(--muted);margin:0}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    .search,select,button{background:#17171b;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit}
    button{cursor:pointer}
    .status{color:var(--muted);margin-bottom:12px}
    .section{margin-bottom:24px}
    .section h3{margin:0 0 12px;font-size:1.2rem;color:#cfd0d6}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,.3)}
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .card-header h2{font-size:1.4rem;margin:0}
    .badge{font-size:.85rem;font-weight:700;padding:4px 8px;border-radius:6px}
    .badge.ifr{background:#004835;color:var(--accent)}
    .badge.vfr{background:#003322;color:#00f099}
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
    .box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px}
    .label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
    .value{font-size:1rem;font-weight:600}
    .raw{font-size:.8rem;color:var(--muted);background:rgba(0,0,0,.2);padding:8px;border-radius:6px;word-break:break-all;margin-top:10px}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Painel Aeroportos Brasil v33</h1>
    <p>Aeroportos organizados por região, com Sudeste antes do Nordeste</p>
  </header>
  <div class="toolbar">
    <input id="q" class="search" placeholder="SBSP, Recife, IFR">
    <select id="sort"><option value="region">Região geográfica</option><option value="cat">Pior categoria primeiro</option><option value="icao">ICAO</option></select>
    <button id="refresh">Atualizar</button>
    <button id="theme">Tema</button>
  </div>
  <div id="status" class="status">Carregando...</div>
  <div id="sections"></div>
</div>
<script>
const WORKER_URL='https://weathered-grass-f181.alexgrodrigues.workers.dev/';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rank=c=>({LIFR:0,IFR:1,MVFR:2,VFR:3}[String(c||'').toUpperCase()]??9);
const regionOrder=['Sul','Sudeste','Centro-Oeste','Nordeste','Norte'];
function regionOf(icao){const s=String(icao||'').toUpperCase(); if(['SBPA','SBSM','SBFL','SBCT','SBBG','SBNF','SBPK','SBUG','SBPF','SBCX'].includes(s)) return 'Sul'; if(['SBSP','SBJP','SBKP','SBRF','SBGR','SBGL','SBRJ','SBCF'].includes(s)) return 'Sudeste'; if(['SBBR','SBCG','SBIZ','SBMG','SBCY'].includes(s)) return 'Centro-Oeste'; if(['SBFZ','SBNT','SBSV','SBIL','SBPV','SBMA','SBRP'].includes(s)) return 'Nordeste'; return 'Norte';}
function card(r){const cat=String(r.category||'N/A').toUpperCase(); const ifr=cat==='IFR'||cat==='LIFR'; return `<article class="card"><div class="card-header"><h2>${esc(r.icao)} <small style="font-size:.9rem;color:var(--muted)">${esc(r.name||'')}</small></h2><span class="badge ${ifr?'ifr':'vfr'}">${esc(cat)}</span></div><div class="metrics"><div class="box"><span class="label">Vento</span><span class="value">${esc(r.windDirection||'—')}° / ${esc(r.windIntensity||'—')} KT</span></div><div class="box"><span class="label">Pressão Atmosférica</span><span class="value">${esc(r.pressure||'—')}</span></div><div class="box"><span class="label">Temperatura Atual</span><span class="value">${esc(r.temperature?.current ?? '—')}ºC</span></div><div class="box"><span class="label">Ponto de Orvalho</span><span class="value">${esc(r.temperature?.dewpoint ?? '—')}ºC</span></div></div><div class="raw"><strong>METAR raw:</strong> ${esc(r.metar||'—')}</div>${r.taf?`<div class="raw"><strong>TAF raw:</strong> ${esc(r.taf)}</div>`:''}</article>`}
async function load(){try{$('status').textContent='Carregando dados...'; const res=await fetch(WORKER_URL,{cache:'no-store'}); if(!res.ok) throw new Error(`HTTP ${res.status}`); const data=await res.json(); const rows=Array.isArray(data.rows)?data.rows:[]; const q=$('q').value.trim().toLowerCase(); let filtered=rows.filter(r=>!q||`${r.icao} ${r.name} ${r.city} ${r.state} ${r.category}`.toLowerCase().includes(q)); if($('sort').value==='icao') filtered.sort((a,b)=>String(a.icao).localeCompare(String(b.icao))); else if($('sort').value==='cat') filtered.sort((a,b)=>rank(a.category)-rank(b.category)); else filtered.sort((a,b)=>regionOrder.indexOf(regionOf(a.icao))-regionOrder.indexOf(regionOf(b.icao))||String(a.icao).localeCompare(String(b.icao))); const grouped={}; for(const r of filtered){const reg=regionOf(r.icao); (grouped[reg]||(grouped[reg]=[])).push(r);} const html=regionOrder.filter(reg=>grouped[reg]&&grouped[reg].length).map(reg=>`<section class="section"><h3>${reg}</h3><div class="grid">${grouped[reg].map(card).join('')}</div></section>`).join(''); $('sections').innerHTML=html; $('status').textContent=rows.length?`Atualizado com ${rows.length} aeroportos`:'Nenhum aeroporto retornado pela API';}catch(e){$('status').textContent='Erro ao carregar dados: '+e.message; $('sections').innerHTML='';}}
$('refresh').onclick=load;$('theme').onclick=()=>document.body.classList.toggle('light');$('q').oninput=load;$('sort').onchange=load;load();
</script>
</body>
</html>
