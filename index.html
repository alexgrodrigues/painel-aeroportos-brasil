<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principais Aeroportos da América do Sul</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --vfr-color: #22c55e;
            --mvfr-color: #3b82f6;
            --ifr-color: #ef4444;
            --lifr-color: #a855f7;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .version {
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input, select, button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input {
            width: 250px;
        }

        button {
            cursor: pointer;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: border-color 0.2s;
        }

        .card.alert-critical {
            border-color: var(--ifr-color);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .icao {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .airport-name {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.VFR { background-color: var(--vfr-color); color: #000; }
        .badge.MVFR { background-color: var(--mvfr-color); color: #fff; }
        .badge.IFR { background-color: var(--ifr-color); color: #fff; }
        .badge.LIFR { background-color: var(--lifr-color); color: #fff; }
        .badge.N/A { background-color: var(--border-color); color: var(--text-muted); }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: block;
            margin-bottom: 2px;
        }

        .raw-data {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
            word-break: break-all;
            color: var(--accent-color);
            line-height: 1.3;
        }

        .taf-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .taf-toggle {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
        }

        .taf-toggle:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .taf-content {
            display: none;
        }

        .taf-content.show {
            display: block;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Principais Aeroportos da América do Sul</h1>
        <div class="version">VERSÃO 40.0 — AMÉRICA DO SUL COM TAF E ALERTA</div>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Pesquisar ICAO, Cidade, IFR..." oninput="filterAirports()">
        <select id="regionFilter" onchange="filterAirports()">
            <option value="ALL">Todas as Regiões / Países</option>
            <option value="BR">Brasil</option>
            <option value="SA">Argentina</option>
            <option value="SL">Bolívia</option>
            <option value="SC">Chile</option>
            <option value="SK">Colômbia</option>
            <option value="SE">Equador</option>
            <option value="SG">Paraguai</option>
            <option value="SP">Peru</option>
            <option value="SU">Uruguai</option>
            <option value="SV">Venezuela</option>
        </select>
        <button onclick="loadData()">Atualizar Dados</button>
    </div>

    <div class="status-bar" id="statusBar">Última atualização: —</div>

    <main class="grid" id="airportGrid">
        <div class="loading">Carregando dados meteorológicos...</div>
    </main>

    <script>
        let airportData = [];

        async function loadData() {
            const grid = document.getElementById('airportGrid');
            grid.innerHTML = '<div class="loading">Buscando informações atualizadas...</div>';

            try {
                const response = await fetch('https://weathered-grass-f181.alexgrodrigues.workers.dev/'); 
                const json = await response.json();

                const rows = json.rows || json.dados || [];

                if (json.ok && rows.length > 0) {
                    airportData = rows;
                    renderAirports(airportData);
                    document.getElementById('statusBar').innerText = `Última atualização: ${new Date().toLocaleTimeString()} (${rows.length} aeroportos carregados)`;
                } else {
                    grid.innerHTML = `<div class="loading">Nenhum aeroporto retornado pela API.</div>`;
                }
            } catch (e) {
                grid.innerHTML = `<div class="loading">Erro de conexão com o Worker. Verifique o CORS ou a rede.</div>`;
            }
        }

        function toggleTaf(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('show');
            }
        }

        function renderAirports(data) {
            const grid = document.getElementById('airportGrid');
            if (data.length === 0) {
                grid.innerHTML = '<div class="loading">Nenhum aeroporto encontrado com esses critérios.</div>';
                return;
            }

            grid.innerHTML = data.map((a, index) => {
                const isCritical = a.category === 'IFR' || a.category === 'LIFR';
                const tafId = `taf-${a.icao}-${index}`;

                return `
                    <div class="card ${isCritical ? 'alert-critical' : ''}" data-icao="${a.icao}" data-city="${a.city}" data-country="${a.country}">
                        <div class="card-header">
                            <div>
                                <div class="icao">${a.icao}</div>
                                <div class="airport-name">${a.city ? a.city + (a.name ? ' — ' + a.name : '') : (a.name || 'Aeroporto')} (${a.country})</div>
                            </div>
                            <span class="badge ${a.category}">${a.category}</span>
                        </div>
                        <div class="metrics">
                            <div class="metric-box">
                                <span class="metric-label">💨 Vento</span>
                                <strong>${a.wind}</strong>
                            </div>
                            <div class="metric-box">
                                <span class="metric-label">⚖️ Pressão</span>
                                <strong>${a.pressure}</strong>
                            </div>
                            <div class="metric-box">
                                <span class="metric-label">🌡️ Temperatura</span>
                                <strong>${a.temperature?.current ?? '—'}°C</strong>
                            </div>
                            <div class="metric-box">
                                <span class="metric-label">💧 Ponto de Orvalho</span>
                                <strong>${a.temperature?.dewpoint ?? '—'}°C</strong>
                            </div>
                        </div>
                        ${a.metar ? `<div class="raw-data"><strong>METAR:</strong> ${a.metar}</div>` : ''}
                        ${a.taf ? `
                            <div class="taf-container">
                                <button class="taf-toggle" onclick="toggleTaf('${tafId}')">📋 Ver Previsão TAF</button>
                                <div id="${tafId}" class="taf-content raw-data"><strong>TAF:</strong> ${a.taf}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function filterAirports() {
            const term = document.getElementById('search').value.toUpperCase();
            const prefixFilter = document.getElementById('regionFilter').value;

            const filtered = airportData.filter(a => {
                const matchTerm = a.icao.includes(term) || (a.city && a.city.toUpperCase().includes(term)) || (a.name && a.name.toUpperCase().includes(term)) || (a.category && a.category.includes(term));
                
                let matchRegion = true;
                if (prefixFilter === 'BR') {
                    matchRegion = a.icao.startsWith('SB');
                } else if (prefixFilter !== 'ALL') {
                    matchRegion = a.icao.startsWith(prefixFilter);
                }

                return matchTerm && matchRegion;
            });

            renderAirports(filtered);
        }

        // Carga inicial
        loadData();
    </script>
</body>
</html>
