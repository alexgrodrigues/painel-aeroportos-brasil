<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principais Aeroportos da América Latina</title>
    <!-- Favicon com o caça Gripen da FAB -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231e293b%22/><path d=%22M20 65 L45 55 L75 30 L85 32 L70 60 L45 75 Z%22 fill=%22%2338bdf8%22/><text y=%22.9em%22 font-size=%2260%22 x=%2215%22>✈️</text></svg>">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --vfr-color: #22c55e;
            --mvfr-color: #3b82f6;
            --ifr-color: #ef4444;
            --lifr-color: #a855f7;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .version {
            color: var(--accent-color);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-container {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .search-container input {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 35px 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 260px;
        }

        .clear-search-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: none;
            padding: 0;
        }

        .clear-search-btn:hover {
            color: var(--text-color);
            opacity: 1;
        }

        button {
            cursor: pointer;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .operational-counters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .counter-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .counter-badge strong {
            font-size: 1rem;
        }

        .counter-total { border-color: var(--accent-color); color: var(--accent-color); }
        .counter-vfr { border-color: var(--vfr-color); color: var(--vfr-color); }
        .counter-mvfr { border-color: var(--mvfr-color); color: var(--mvfr-color); }
        .counter-ifr { border-color: var(--ifr-color); color: var(--ifr-color); }
        .counter-lifr { border-color: var(--lifr-color); color: var(--lifr-color); }

        .country-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .filter-chips {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .chip {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .chip:hover, .chip.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .active-filter-summary {
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: border-color 0.2s;
        }

        .card.alert-critical {
            border-color: var(--ifr-color);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.25);
        }

        .card.card-missing-data {
            border-color: rgba(245, 158, 11, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .icao {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .airport-name {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 6px;
        }

        .age-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
        }
        .age-badge.fresh { color: var(--vfr-color); }
        .age-badge.stale { color: var(--warning-color); background: rgba(245, 158, 11, 0.15); }
        .age-badge.missing { color: var(--danger-color); background: rgba(239, 68, 68, 0.15); }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.VFR { background-color: var(--vfr-color); color: #000; }
        .badge.MVFR { background-color: var(--mvfr-color); color: #fff; }
        .badge.IFR { background-color: var(--ifr-color); color: #fff; }
        .badge.LIFR { background-color: var(--lifr-color); color: #fff; }
        .badge.N/A { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: block;
            margin-bottom: 2px;
        }

        .raw-data {
            font-family: monospace;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 6px;
            word-break: break-all;
            color: var(--accent-color);
            line-height: 1.3;
        }

        .missing-metar-msg {
            font-size: 0.8rem;
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid var(--danger-color);
            padding: 8px 10px;
            border-radius: 0 6px 6px 0;
            line-height: 1.4;
        }

        .interpreted-data {
            font-size: 0.85rem;
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent-color);
            padding: 8px 10px;
            border-radius: 0 6px 6px 0;
            color: #e2e8f0;
            line-height: 1.4;
        }

        .taf-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .taf-toggle {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
        }

        .taf-toggle:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .taf-content {
            display: none;
        }

        .taf-content.show {
            display: block;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
        }

        .status-bar {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Principais Aeroportos da América Latina</h1>
        <div class="version">VERSÃO 45.13</div>
    </header>

    <div class="controls">
        <div class="search-container">
            <input type="text" id="search" placeholder="🔍 Pesquisar ICAO, Cidade..." oninput="handleSearchInput()">
            <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()" title="Limpar pesquisa">✕</button>
        </div>
        <button onclick="loadData()">Atualizar Dados</button>
    </div>

    <div class="operational-counters" id="operationalCounters">
        <div class="counter-badge counter-total">📊 Total: <strong id="count-total">0</strong></div>
        <div class="counter-badge counter-vfr">🟢 VFR: <strong id="count-vfr">0</strong></div>
        <div class="counter-badge counter-mvfr">🔵 MVFR: <strong id="count-mvfr">0</strong></div>
        <div class="counter-badge counter-ifr">🔴 IFR: <strong id="count-ifr">0</strong></div>
        <div class="counter-badge counter-lifr">🟣 LIFR: <strong id="count-lifr">0</strong></div>
    </div>

    <div class="country-tabs" id="countryTabs">
        <button class="tab-btn active" onclick="setCountryFilter('ALL', '🌐 Todos', this)">🌐 Todos</button>
        <button class="tab-btn" onclick="setCountryFilter('BR', '🇧🇷 Brasil', this)">🇧🇷 Brasil</button>
        <button class="tab-btn" onclick="setCountryFilter('AR', '🇦🇷 Argentina', this)">🇦🇷 Argentina</button>
        <button class="tab-btn" onclick="setCountryFilter('CL', '🇨🇱 Chile', this)">🇨🇱 Chile</button>
        <button class="tab-btn" onclick="setCountryFilter('MX', '🇲🇽 México', this)">🇲🇽 México</button>
        <button class="tab-btn" onclick="setCountryFilter('PA', '🇵🇦 Panamá', this)">🇵🇦 Panamá</button>
        <button class="tab-btn" onclick="setCountryFilter('CR', '🇨🇷 Costa Rica', this)">🇨🇷 Costa Rica</button>
        <button class="tab-btn" onclick="setCountryFilter('OTHER', '🌎 Outros', this)">🌎 Outros (América do Sul / Central)</button>
    </div>

    <div class="filter-chips">
        <div class="chip active" onclick="setFlightCategory('ALL', 'Todas as Condições', this)">Todas as Condições</div>
        <div class="chip" onclick="setFlightCategory('VFR', '🟢 VFR (Visual)', this)">🟢 VFR (Visual)</div>
        <div class="chip" onclick="setFlightCategory('MVFR', '🔵 MVFR (Marginal)', this)">🔵 MVFR (Marginal)</div>
        <div class="chip" onclick="setFlightCategory('IFR', '🔴 IFR (Restrito)', this)">🔴 IFR (Restrito)</div>
        <div class="chip" onclick="setFlightCategory('LIFR', '🟣 LIFR (Crítico)', this)">🟣 LIFR (Crítico)</div>
    </div>

    <div class="active-filter-summary" id="activeFilterSummary">Exibindo: 🌐 Todos | 📋 Todas as Condições</div>

    <div class="status-bar" id="statusBar">Última atualização: —</div>

    <main class="grid" id="airportGrid">
        <div class="loading">Carregando dados meteorológicos...</div>
    </main>

    <script>
        let airportData = [];
        let activeCategoryFilter = 'ALL';
        let activeCountryFilter = 'ALL';
        let currentCountryName = '🌐 Todos';
        let currentCategoryName = 'Todas as Condições';

        async function loadData() {
            const grid = document.getElementById('airportGrid');
            grid.innerHTML = '<div class="loading">Buscando informações atualizadas...</div>';

            try {
                const response = await fetch('https://weathered-grass-f181.alexgrodrigues.workers.dev/');
                if (!response.ok) {
                    throw new Error('Erro HTTP: ' + response.status);
                }
                const json = await response.json();
                const rows = json.rows || json.dados || [];

                if (json.ok && rows.length > 0) {
                    airportData = rows;
                    filterAirports();
                    document.getElementById('statusBar').innerText = 'Última atualização: ' + new Date().toLocaleTimeString() + ' (' + rows.length + ' aeroportos carregados)';
                } else {
                    grid.innerHTML = '<div class="loading">Nenhum aeroporto retornado pela API.</div>';
                }
            } catch (e) {
                grid.innerHTML = '<div class="loading">Erro de conexão ou falha ao carregar dados do Worker (' + (e?.message || e) + ').</div>';
            }
        }

        function updateCounters(filteredData) {
            const totals = { VFR: 0, MVFR: 0, IFR: 0, LIFR: 0, 'N/A': 0 };
            filteredData.forEach(function(a) {
                const cat = a.category && totals[a.category] !== undefined ? a.category : 'N/A';
                if (totals[cat] !== undefined) totals[cat]++;
            });

            document.getElementById('count-total').innerText = filteredData.length;
            document.getElementById('count-vfr').innerText = totals.VFR;
            document.getElementById('count-mvfr').innerText = totals.MVFR;
            document.getElementById('count-ifr').innerText = totals.IFR;
            document.getElementById('count-lifr').innerText = totals.LIFR;
        }

        function updateFilterSummary() {
            const summaryEl = document.getElementById('activeFilterSummary');
            summaryEl.innerText = `Filtro ativo: ${currentCountryName} + ${currentCategoryName}`;
        }

        function toggleTaf(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle('show');
            }
        }

        function setFlightCategory(cat, name, element) {
            activeCategoryFilter = cat;
            currentCategoryName = name;
            document.querySelectorAll('.filter-chips .chip').forEach(function(c) {
                c.classList.remove('active');
            });
            element.classList.add('active');
            updateFilterSummary();
            filterAirports();
        }

        function setCountryFilter(country, name, element) {
            activeCountryFilter = country;
            currentCountryName = name;
            document.querySelectorAll('.country-tabs .tab-btn').forEach(function(b) {
                b.classList.remove('active');
            });
            element.classList.add('active');
            updateFilterSummary();
            filterAirports();
        }

        function handleSearchInput() {
            const input = document.getElementById('search');
            const clearBtn = document.getElementById('clearSearchBtn');
            if (input.value.length > 0) {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }
            filterAirports();
        }

        function clearSearch() {
            const input = document.getElementById('search');
            input.value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            filterAirports();
            input.focus();
        }

        function getMetarAgeInfo(metarString) {
            if (!metarString) return { text: 'Sem METAR disponível', isStale: false, isMissing: true };
            const match = metarString.match(/\b\d{2}(\d{2})(\d{2})Z\b/);
            if (!match) return { text: 'Formato METAR inválido', isStale: false, isMissing: true };

            const reportHour = parseInt(match[1], 10);
            const reportMin = parseInt(match[2], 10);

            const now = new Date();
            const nowUTC = new Date(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), now.getUTCMinutes());
            
            const reportDate = new Date(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), reportHour, reportMin);
            
            let diffMs = nowUTC - reportDate;
            if (diffMs < 0) {
                reportDate.setUTCDate(reportDate.getUTCDate() - 1);
                diffMs = nowUTC - reportDate;
            }

            const diffMins = Math.floor(diffMs / (1000 * 60));
            if (diffMins < 0) return { text: `${match[1]}:${match[2]}Z`, isStale: false, isMissing: false };

            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;

            let ageText = hours > 0 ? `há ${hours}h ${mins}m` : `há ${mins}m`;
            const isStale = diffMins > 90;

            return { text: `${match[1]}:${match[2]}Z (${ageText})`, isStale, isMissing: false };
        }

        function renderAirports(data) {
            const grid = document.getElementById('airportGrid');
            if (data.length === 0) {
                grid.innerHTML = '<div class="loading">Nenhum aeroporto encontrado com esses critérios.</div>';
                return;
            }

            grid.innerHTML = data.map(function(a, index) {
                const isCritical = a.category === 'IFR' || a.category === 'LIFR';
                const isMissing = !a.metar || a.category === 'N/A';
                const tafId = 'taf-' + a.icao + '-' + index;
                const ageInfo = getMetarAgeInfo(a.metar);

                return '<div class="card ' + (isCritical && !isMissing ? 'alert-critical' : '') + ' ' + (isMissing ? 'card-missing-data' : '') + '" data-icao="' + a.icao + '" data-city="' + (a.city || '') + '" data-country="' + a.country + '">' +
                    '<div class="card-header">' +
                        '<div>' +
                            '<div class="icao">' + a.icao + '</div>' +
                            '<div class="airport-name">' + (a.city ? a.city + (a.name ? ' — ' + a.name : '') : (a.name || 'Aeroporto')) + ' (' + a.country + ')</div>' +
                        '</div>' +
                        '<span class="badge ' + a.category + '">' + (isMissing ? 'Sem METAR' : a.category) + '</span>' +
                    '</div>' +
                    '<div class="card-meta-row">' +
                        '<span>⏱️ METAR: <span class="age-badge ' + (ageInfo.isMissing ? 'missing' : (ageInfo.isStale ? 'stale' : 'fresh')) + '">' + ageInfo.text + '</span></span>' +
                        '<span>ICAO: ' + a.icao + '</span>' +
                    '</div>' +
                    (isMissing ? 
                        '<div class="missing-metar-msg">⚠️ <strong>Atenção:</strong> Relatório METAR ausente ou indisponível para esta estação no momento.</div>' :
                        '<div class="metrics">' +
                            '<div class="metric-box">' +
                                '<span class="metric-label">💨 Vento</span>' +
                                '<strong>' + a.wind + '</strong>' +
                            '</div>' +
                            '<div class="metric-box">' +
                                '<span class="metric-label">⚖️ Pressão</span>' +
                                '<strong>' + a.pressure + '</strong>' +
                            '</div>' +
                            '<div class="metric-box">' +
                                '<span class="metric-label">🌡️ Temperatura</span>' +
                                '<strong>' + (a.temperature?.current ?? '—') + '°C</strong>' +
                            '</div>' +
                            '<div class="metric-box">' +
                                '<span class="metric-label">💧 Ponto de Orvalho</span>' +
                                '<strong>' + (a.temperature?.dewpoint ?? '—') + '°C</strong>' +
                            '</div>' +
                        '</div>' +
                        '<div class="raw-data"><strong>METAR:</strong> ' + a.metar + '</div>'
                    ) +
                    (a.tafInterpret ? '<div class="interpreted-data">💡 <strong>Previsão Traduzida:</strong> ' + a.tafInterpret + '</div>' : '') +
                    (a.taf ? '<div class="taf-container"><button class="taf-toggle" onclick="toggleTaf(\'' + tafId + '\')">📋 Ver Código Técnico TAF</button><div id="' + tafId + '" class="taf-content raw-data"><strong>TAF:</strong> ' + a.taf + '</div></div>' : '') +
                '</div>';
            }).join('');
        }

        function filterAirports() {
            const rawTerm = document.getElementById('search').value.trim().toUpperCase();

            const countryFiltered = airportData.filter(function(a) {
                if (activeCountryFilter === 'ALL') return true;
                return a.group === activeCountryFilter;
            });

            updateCounters(countryFiltered);

            const finalFiltered = countryFiltered.filter(function(a) {
                let matchTerm = true;
                if (rawTerm.length > 0) {
                    const matchIcao = a.icao.toUpperCase().includes(rawTerm);
                    const matchCity = a.city && a.city.toUpperCase().includes(rawTerm);
                    const matchName = a.name && a.name.toUpperCase().includes(rawTerm);
                    matchTerm = matchIcao || matchCity || matchName;
                }
                
                let matchCategory = true;
                if (activeCategoryFilter !== 'ALL') {
                    matchCategory = a.category === activeCategoryFilter;
                }

                return matchTerm && matchCategory;
            });

            renderAirports(finalFiltered);
        }

        setInterval(loadData, 600000);
        loadData();
    </script>
</body>
</html>
