<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Aeroportos Globais</title>
  <!-- Favicon Único e Identificador da Aba (Radar / Aviação) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2338bdf8%22><path d=%22M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z%22/></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card-bg { background-color: #1e293b; border: 1px solid #334155; }
    .badge-vfr { background-color: #22c55e; color: #fff; }
    .badge-mvfr { background-color: #3b82f6; color: #fff; }
    .badge-ifr { background-color: #ef4444; color: #fff; }
    .badge-lifr { background-color: #a855f7; color: #fff; }
    .badge-na { background-color: #64748b; color: #fff; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto">
    <!-- Cabeçalho -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-700 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-sky-400">✈️ Painel de Aeroportos Globais</h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">Monitoramento meteorológico aeronáutico (METAR e TAF) em tempo real</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="loadWeatherData()" id="refresh-btn" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 cursor-pointer shadow-md">
          🔄 Atualizar Dados
        </button>
        <button onclick="clearFavorites()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
          🧹 Limpar Favoritos
        </button>
      </div>
    </header>

    <!-- Barra de Pesquisa e Filtros -->
    <div class="card-bg p-4 rounded-xl mb-6 shadow-lg flex flex-col gap-4">
      <div class="relative">
        <input type="text" id="search-input" oninput="filterAirports()" placeholder="🔍 Pesquisar por ICAO, IATA, Cidade ou Nome do Aeroporto..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
      </div>

      <!-- Filtros de Região e Grupo -->
      <div class="flex flex-wrap gap-2 items-center text-xs">
        <span class="text-slate-400 font-semibold mr-1">Região:</span>
        <button onclick="setGroupFilter('ALL')" id="filter-all" class="region-btn px-3 py-1.5 rounded-lg bg-sky-600 text-white font-medium transition cursor-pointer">🌐 Todos</button>
        <button onclick="setGroupFilter('FAVS')" id="filter-favs" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">⭐ Favoritos</button>
        <button onclick="setGroupFilter('AIRBASE')" id="filter-airbase" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">📍 Bases Aéreas</button>
        <button onclick="setGroupFilter('SOUTH_AMERICA')" id="filter-sa" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">🟢 América do Sul</button>
        <button onclick="setGroupFilter('NORTH_AMERICA')" id="filter-na" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">🔵 América do Norte</button>
        <button onclick="setGroupFilter('EUROPE')" id="filter-eu" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">🇪🇺 Europa</button>
        <button onclick="setGroupFilter('ASIA_ME')" id="filter-as" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">🌏 Ásia / Oriente Médio</button>
        <button onclick="setGroupFilter('AFRICA')" id="filter-af" class="region-btn px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">🌍 África</button>
      </div>

      <!-- Sub-filtro de Países (Aparece dinamicamente ao selecionar uma região) -->
      <div id="country-filter-bar" class="hidden flex flex-wrap gap-2 items-center text-xs pt-3 border-t border-slate-800">
        <span class="text-sky-400 font-semibold mr-1">Filtrar por País:</span>
        <div id="country-buttons" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Estatísticas Rápidas -->
      <div id="stats-bar" class="text-xs text-slate-400 flex flex-wrap gap-4 pt-2 border-t border-slate-800">
        <span>Carregando estatísticas...</span>
      </div>
    </div>

    <!-- Container dos Cards de Aeroportos -->
    <div id="airports-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400">
        Carregando dados meteorológicos do Worker...
      </div>
    </div>

    <!-- Rodapé -->
    <footer class="mt-12 pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
      <p id="footer-info">Fonte: Aviation Weather | Painel de Aeroportos Globais</p>
    </footer>
  </div>

  <script>
    const WORKER_URL = "https://weathered-grass-f181.alexgrodrigues.workers.dev/";
    let globalData = { rows: [] };
    let currentGroupFilter = "ALL";
    let currentCountryFilter = "ALL";
    let favorites = JSON.parse(localStorage.getItem("fav_airports") || "[]");

    const COUNTRY_MAP = {
      "BR": "🇧🇷 Brasil", "AR": "🇦🇷 Argentina", "CL": "🇨🇱 Chile", "PE": "🇵🇪 Peru",
      "CO": "🇨🇴 Colômbia", "UY": "🇺🇾 Uruguai", "PY": "🇵🇾 Paraguai", "US": "🇺🇸 Estados Unidos",
      "MX": "🇲🇽 México", "PT": "🇵🇹 Portugal", "ES": "🇪🇸 Espanha", "FR": "🇫🇷 França",
      "GB": "🇬🇧 Reino Unido", "DE": "🇩🇪 Alemanha", "TR": "🇹🇷 Turquia", "GI": "🇬🇮 Gibraltar",
      "RU": "🇷🇺 Rússia", "AE": "🇦🇪 Emirados Árabes", "JP": "🇯🇵 Japão", "CN": "🇨🇳 China",
      "SG": "🇸🇬 Cingapura", "KR": "🇰🇷 Coreia do Sul", "ZA": "🇿🇦 África do Sul", "EG": "🇪🇬 Egito", "MA": "🇲🇦 Marrocos"
    };

    function formatCountry(code) {
      return COUNTRY_MAP[code] || code || "BR";
    }

    async function loadWeatherData() {
      const container = document.getElementById("airports-container");
      container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Atualizando dados meteorológicos...</div>`;
      
      try {
        const response = await fetch(WORKER_URL);
        const json = await response.json();
        if (json.ok && Array.isArray(json.rows)) {
          globalData = json;
          renderUI();
        } else {
          throw new Error("Formato de resposta inválido do Worker.");
        }
      } catch (err) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-red-400">Erro ao carregar dados do Worker: ${err.message}</div>`;
      }
    }

    function setGroupFilter(group) {
      currentGroupFilter = group;
      currentCountryFilter = "ALL"; // Reseta o país ao mudar de região

      document.querySelectorAll(".region-btn").forEach(btn => {
        btn.classList.remove("bg-sky-600", "text-white");
        btn.classList.add("bg-slate-800", "text-slate-300");
      });
      
      const activeBtn = event.target;
      activeBtn.classList.remove("bg-slate-800", "text-slate-300");
      activeBtn.classList.add("bg-sky-600", "text-white");
      
      // Gerenciamento do sub-filtro de países
      const countryBar = document.getElementById("country-filter-bar");
      const countryButtonsContainer = document.getElementById("country-buttons");
      
      const regionalAirports = globalData.rows.filter(r => r.group === group);
      const uniqueCountries = [...new Set(regionalAirports.map(r => r.country))];

      if ((group === "SOUTH_AMERICA" || group === "EUROPE" || group === "NORTH_AMERICA") && uniqueCountries.length > 1) {
        countryBar.classList.remove("hidden");
        let html = `<button onclick="setCountryFilter('ALL')" class="country-btn px-2.5 py-1 rounded bg-sky-700 text-white transition cursor-pointer">🌐 Todos</button>`;
        uniqueCountries.forEach(code => {
          html += `<button onclick="setCountryFilter('${code}')" class="country-btn px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer">${formatCountry(code)}</button>`;
        });
        countryButtonsContainer.innerHTML = html;
      } else {
        countryBar.classList.add("hidden");
      }

      filterAirports();
    }

    function setCountryFilter(countryCode) {
      currentCountryFilter = countryCode;
      document.querySelectorAll(".country-btn").forEach(btn => {
        btn.classList.remove("bg-sky-700", "text-white");
        btn.classList.add("bg-slate-800", "text-slate-300");
      });
      event.target.classList.remove("bg-slate-800", "text-slate-300");
      event.target.classList.add("bg-sky-700", "text-white");
      
      filterAirports();
    }

    function toggleFavorite(icao) {
      if (favorites.includes(icao)) {
        favorites = favorites.filter(f => f !== icao);
      } else {
        favorites.push(icao);
      }
      localStorage.setItem("fav_airports", JSON.stringify(favorites));
      filterAirports();
    }

    function clearFavorites() {
      favorites = [];
      localStorage.removeItem("fav_airports");
      filterAirports();
    }

    function filterAirports() {
      const searchTerm = document.getElementById("search-input").value.toLowerCase();
      const rows = globalData.rows || [];

      const filtered = rows.filter(item => {
        const matchesSearch = 
          item.icao.toLowerCase().includes(searchTerm) ||
          (item.iata && item.iata.toLowerCase().includes(searchTerm)) ||
          item.name.toLowerCase().includes(searchTerm) ||
          item.city.toLowerCase().includes(searchTerm);

        if (!matchesSearch) return false;

        if (currentGroupFilter === "FAVS") return favorites.includes(item.icao);
        if (currentGroupFilter === "AIRBASE") return item.isAirBase === true;
        
        if (currentGroupFilter !== "ALL") {
          if (item.group !== currentGroupFilter) return false;
          if (currentCountryFilter !== "ALL" && item.country !== currentCountryFilter) return false;
        }

        return true;
      });

      renderCards(filtered);
      updateStats(rows, filtered);
    }

    function updateStats(allRows, filteredRows) {
      const statsBar = document.getElementById("stats-bar");
      const vfr = allRows.filter(r => r.category === "VFR").length;
      const mvfr = allRows.filter(r => r.category === "MVFR").length;
      const ifr = allRows.filter(r => r.category === "IFR").length;
      const lifr = allRows.filter(r => r.category === "LIFR").length;

      statsBar.innerHTML = `
        <span>📊 Exibidos: <strong>${filteredRows.length}</strong> / Total: <strong>${allRows.length}</strong></span>
        <span class="text-green-400">🟢 VFR: ${vfr}</span>
        <span class="text-blue-400">🔵 MVFR: ${mvfr}</span>
        <span class="text-red-400">🔴 IFR: ${ifr}</span>
        <span class="text-purple-400">🟣 LIFR: ${lifr}</span>
      `;
      
      if (globalData.fetchedAt) {
        document.getElementById("footer-info").innerText = `Fonte: Aviation Weather | Atualizado às ${globalData.fetchedAt} (${allRows.length} aeroportos)`;
      }
    }

    function renderCards(rows) {
      const container = document.getElementById("airports-container");
      if (rows.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Nenhum aeroporto encontrado com os filtros atuais.</div>`;
        return;
      }

      container.innerHTML = rows.map(item => {
        const isFav = favorites.includes(item.icao);
        const catClass = item.category === "VFR" ? "badge-vfr" : item.category === "MVFR" ? "badge-mvfr" : item.category === "IFR" ? "badge-ifr" : item.category === "LIFR" ? "badge-lifr" : "badge-na";
        const countryFormatted = formatCountry(item.country);
        const runwaysStr = item.runways ? item.runways.join(" • ") : "Não informada";
        const towerFreq = item.frequencies?.tower ? `Torre: ${item.frequencies.tower}` : "";
        const atisFreq = item.frequencies?.atis ? `ATIS: ${item.frequencies.atis}` : "";
        const freqStr = [towerFreq, atisFreq].filter(Boolean).join(" | ");

        return `
          <div class="card-bg rounded-xl p-5 shadow-md flex flex-col justify-between transition hover:border-slate-500">
            <div>
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold text-slate-100 text-base leading-snug">${item.name}</h3>
                  <p class="text-xs text-slate-400 mt-0.5">ICAO: <span class="text-sky-400 font-mono font-bold">${item.icao}</span> ${item.iata ? `• IATA: <span class="text-slate-200 font-mono">${item.iata}</span>` : ""} • ${item.city} (${countryFormatted})</p>
                </div>
                <button onclick="toggleFavorite('${item.icao}')" class="text-xl text-amber-400 hover:scale-110 transition cursor-pointer" title="Favoritar">${isFav ? "★" : "☆"}</button>
              </div>

              <div class="flex flex-wrap gap-2 my-3 items-center">
                <span class="px-2.5 py-1 rounded-md text-xs font-bold ${catClass}">${item.category}</span>
                ${item.isAirBase ? '<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-emerald-900/60 text-emerald-300 border border-emerald-700">📍 Base Aérea</span>' : ''}
              </div>

              <div class="grid grid-cols-3 gap-2 text-xs bg-slate-900/50 p-2.5 rounded-lg mb-3 border border-slate-800">
                <div>
                  <span class="block text-slate-500">Vento</span>
                  <strong class="text-slate-200">${item.wind}</strong>
                </div>
                <div>
                  <span class="block text-slate-500">Pressão</span>
                  <strong class="text-slate-200">${item.pressure}</strong>
                </div>
                <div>
                  <span class="block text-slate-500">Temperatura</span>
                  <strong class="text-slate-200">${item.temperature?.current !== null ? item.temperature.current + '°C' : '—'}</strong>
                </div>
              </div>

              <div class="mb-3">
                <p class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">📡 METAR (Condição Atual)</p>
                <div class="bg-slate-900 p-2.5 rounded-lg font-mono text-xs text-slate-300 border border-slate-800 break-all">${item.metar || "METAR indisponível no momento."}</div>
                <p class="text-xs text-slate-400 mt-1.5 italic">${item.metarInterpret}</p>
              </div>

              <div>
                <p class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">⏱️ TAF (Previsão)</p>
                <div class="bg-slate-900 p-2.5 rounded-lg font-mono text-xs text-slate-300 border border-slate-800 break-all">${item.taf || "TAF indisponível no momento."}</div>
                <p class="text-xs text-slate-400 mt-1.5">${item.tafInterpret}</p>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800 text-[11px] text-slate-400 flex flex-col gap-1">
              ${freqStr ? `<div>📡 <strong>Frequências:</strong> ${freqStr}</div>` : ""}
              <div>🛫 <strong>Pistas:</strong> ${runwaysStr}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderUI() {
      filterAirports();
    }

    loadWeatherData();
  </script>
</body>
</html>
