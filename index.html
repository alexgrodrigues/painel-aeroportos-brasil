<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Principais Aeroporto Mercosul v36</title>
  <style>
    :root{--bg:#121214;--card:#1a1a1e;--text:#e1e1e6;--muted:#a8a8b3;--accent:#00b37e;--border:#29292e}
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px}
    .container{max-width:1200px;margin:0 auto}
    header{margin-bottom:24px}
    h1{margin:0 0 8px;font-size:1.8rem}
    p{margin:0;color:var(--muted)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}
    .search,select,button{background:#17171b;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit}
    button{cursor:pointer}
    .status{color:var(--muted);margin-bottom:12px}
    .section{margin-bottom:26px}
    .section h2{margin:0 0 12px;font-size:1.2rem;color:#cfd0d6}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .icao{font-size:1.2rem;font-weight:800}
    .badge{padding:4px 8px;border-radius:6px;background:#004835;color:var(--accent);font-weight:700}
    .row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px}
    .label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
    .value{font-weight:600}
    .raw{margin-top:10px;font-size:.82rem;color:var(--muted);word-break:break-word}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Principais Aeroporto Mercosul v36</h1>
    <p>Maior painel com aeroportos do Brasil mantidos e novos aeroportos do Mercosul separados por país</p>
  </header>
  <div class="toolbar">
    <input id="q" class="search" placeholder="SAEZ, SBSP, IFR">
    <select id="sort"><option value="country">País</option><option value="icao">ICAO</option></select>
    <button id="refresh">Atualizar</button>
  </div>
  <div id="status" class="status">Carregando...</div>
  <div id="sections"></div>
</div>
<script>
const WORKER_URL='https://weathered-grass-f181.alexgrodrigues.workers.dev/';
const NEW = new Set(['SAEZ','SABE','SUMU','SGAS','SAWH']);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function countryOf(icao){const s=String(icao||'').toUpperCase(); if(s.startsWith('SB')) return 'Brasil'; if(s.startsWith('SA')) return 'Argentina'; if(s.startsWith('SU')) return 'Uruguai'; if(s.startsWith('SG')) return 'Paraguai'; return 'Outros';}
function card(r){return `<article class="card"><div class="top"><div><div class="icao">${esc(r.icao)}</div><div style="color:var(--muted)">${esc(r.name||'')}</div></div><div class="badge">${esc(r.category||'N/A')}</div></div><div class="row"><div class="box"><span class="label">Vento</span><span class="value">${esc(r.windDirection||'—')}° / ${esc(r.windIntensity||'—')} KT</span></div><div class="box"><span class="label">Pressão</span><span class="value">${esc(r.pressure||'—')}</span></div><div class="box"><span class="label">Temperatura Atual</span><span class="value">${esc(r.temperature?.current ?? '—')}ºC</span></div><div class="box"><span class="label">Ponto de Orvalho</span><span class="value">${esc(r.temperature?.dewpoint ?? '—')}ºC</span></div></div><div class="raw"><strong>METAR:</strong> ${esc(r.metar||'—')}</div><div class="raw"><strong>TAF:</strong> ${esc(r.taf||'—')}</div></article>`}
async function load(){const res=await fetch(WORKER_URL,{cache:'no-store'}); const data=await res.json(); const rows=Array.isArray(data.rows)?data.rows:[]; const q=$('q').value.trim().toLowerCase(); let filtered=rows.filter(r=>!q||`${r.icao} ${r.name} ${r.city} ${r.state} ${r.category}`.toLowerCase().includes(q)); const countryGroups={}; filtered.forEach(r=>{const c=countryOf(r.icao); (countryGroups[c]||(countryGroups[c]=[])).push(r)}); const countryOrder=['Argentina','Uruguai','Paraguai','Brasil','Outros']; if($('sort').value==='icao'){countryOrder.forEach(c=>countryGroups[c]?.sort((a,b)=>String(a.icao).localeCompare(String(b.icao))));} const html=countryOrder.filter(c=>countryGroups[c]&&countryGroups[c].length).map(c=>`<section class="section"><h2>${c}</h2><div class="grid">${countryGroups[c].map(card).join('')}</div></section>`).join(''); $('sections').innerHTML=html; $('status').textContent=`Atualizado com ${rows.length} aeroportos`;}
$('refresh').onclick=load;$('q').oninput=load;$('sort').onchange=load;load();
</script>
</body>
</html>
