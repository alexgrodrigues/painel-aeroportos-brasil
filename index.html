<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel Aeroportos Brasil v31</title>
  <style>
    body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#16120f;color:#f2ece5}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    .hero,.panel,.card{background:#221d18;border:1px solid #3d342a;border-radius:18px}
    .hero{padding:20px;margin-bottom:16px}
    h1{margin:8px 0 10px;font-size:clamp(1.8rem,4vw,3rem)}
    .muted{color:#c8bfb1}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
    input,button,select{background:#1a1612;color:#f2ece5;border:1px solid #3d342a;border-radius:999px;padding:12px 16px;font:inherit}
    button{cursor:pointer}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px}
    .stat{background:#1a1612;border:1px solid #3d342a;border-radius:16px;padding:14px}
    .value{font-size:1.3rem;font-weight:800;margin-top:4px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:16px}
    .card{padding:16px}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .icao{font-size:1.2rem;font-weight:900}
    .badge{padding:6px 10px;border-radius:999px;background:#2a3a1f;color:#b8df9a;font-weight:700;font-size:.9rem}
    .badge.ifr{background:#3b2024;color:#f2a2a6}
    .mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
    .mini div{background:#1a1612;border:1px solid #3d342a;border-radius:14px;padding:10px}
    .label{color:#c8bfb1;font-size:.9rem}
    .raw{background:#1a1612;border:1px solid #3d342a;border-radius:14px;padding:10px;white-space:pre-wrap;overflow:auto;font-size:.92rem}
    .small{font-size:.92rem}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="muted">BRASIL · METAR EM TEMPO REAL v31</div>
    <h1>Lista responsiva de aeroportos</h1>
    <div class="muted">Mostra dados do Worker com METAR e TAF interpretados.</div>
    <div class="toolbar">
      <input id="q" placeholder="Ex.: SBSP, Recife, IFR">
      <select id="sort"><option value="cat">Pior categoria primeiro</option><option value="icao">ICAO</option></select>
      <button id="refresh">Atualizar</button>
      <button id="theme">Tema</button>
    </div>
    <div id="status" class="muted">Carregando...</div>
  </div>
  <div class="panel">
    <div class="stats">
      <div class="stat"><div class="label">Aeroportos online</div><div class="value" id="nOnline">0</div></div>
      <div class="stat"><div class="label">Com TAF</div><div class="value" id="nTaf">0</div></div>
      <div class="stat"><div class="label">IFR/LIFR</div><div class="value" id="nIfr">0</div></div>
      <div class="stat"><div class="label">Versão</div><div class="value">v31</div></div>
    </div>
    <div id="list" class="grid"></div>
  </div>
</div>
<script>
const WORKER_URL = 'https://weathered-grass-f181.alexgrodrigues.workers.dev/';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sortRank = c => ({LIFR:0,IFR:1,MVFR:2,VFR:3}[String(c||'').toUpperCase()] ?? 9);
function renderCard(r){
  const cat = String(r.category||'N/A').toUpperCase();
  const ifr = cat==='IFR'||cat==='LIFR';
  return `<article class="card">
    <div class="top"><div><div class="icao">${esc(r.icao)}</div><div class="muted small">${esc(r.name||'')}</div></div><div class="badge ${ifr?'ifr':''}">${esc(cat)}</div></div>
    <div class="mini">
      <div><div class="label">Direção</div><div><strong>${esc(r.windDirection||'—')}</strong></div></div>
      <div><div class="label">Intensidade</div><div><strong>${esc(r.windIntensity||'—')} KT</strong></div></div>
      <div><div class="label">Pressão Atmosférica</div><div><strong>${esc(r.pressure||'—')}</strong></div></div>
      <div><div class="label">Visibilidade</div><div><strong>${esc(r.visibility||'—')}</strong></div></div>
      <div><div class="label">Teto</div><div><strong>${esc(r.ceiling||'—')}</strong></div></div>
      <div><div class="label">Temperatura</div><div><strong>${esc(r.temperature||'—')}</strong></div></div>
    </div>
    ${r.pressureAlert ? `<div class="small"><strong>${esc(r.pressureAlert)}</strong></div>` : ''}
    <div class="small"><strong>METAR interpretado:</strong> direção ${esc(r.windDirection||'—')} · intensidade ${esc(r.windIntensity||'—')} KT · pressão ${esc(r.pressure||'—')} · vis ${esc(r.visibility||'—')} · teto ${esc(r.ceiling||'—')} · temp ${esc(r.temperature||'—')}</div>
    <div class="small"><strong>TAF interpretado:</strong> ${esc(r.tafInterpret||'Sem TAF disponível.')}</div>
    <div class="small"><strong>TEND.:</strong> ${esc(r.tafTrend||'sem grupos de tendência relevantes')}</div>
    <div class="small"><strong>Alerta TAF:</strong> ${esc(r.tafAlert||'sem indicação forte de piora')}</div>
    <div class="raw small" style="margin-top:10px"><strong>METAR raw:</strong>
${esc(r.metar||'—')}</div>
    ${r.taf ? `<div class="raw small" style="margin-top:10px"><strong>TAF raw:</strong>
${esc(r.taf)}</div>` : ''}
  </article>`;
}
async function load(){
  try{
    $('status').textContent='Carregando dados...';
    const res = await fetch(WORKER_URL, { cache:'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rows = Array.isArray(data.rows) ? data.rows : [];
    const q = $('q').value.trim().toLowerCase();
    let filtered = rows.filter(r => !q || `${r.icao} ${r.name} ${r.city} ${r.state} ${r.category}`.toLowerCase().includes(q));
    filtered.sort((a,b)=> $('sort').value==='icao' ? String(a.icao).localeCompare(String(b.icao)) : sortRank(a.category)-sortRank(b.category));
    $('list').innerHTML = filtered.map(renderCard).join('');
    $('nOnline').textContent = rows.length;
    $('nTaf').textContent = rows.filter(r => r.taf).length;
    $('nIfr').textContent = rows.filter(r => ['IFR','LIFR'].includes(String(r.category||'').toUpperCase())).length;
    $('status').textContent = rows.length ? `Atualizado com ${rows.length} aeroportos` : 'Nenhum aeroporto retornado pela API';
  } catch (e) {
    $('status').textContent = 'Erro ao carregar dados: ' + e.message;
    $('list').innerHTML = '';
  }
}
$('refresh').onclick = load;
$('theme').onclick = () => document.body.classList.toggle('light');
$('q').oninput = load;
$('sort').onchange = load;
load();
</script>
</body>
</html>
