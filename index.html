<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aeroportos Globais</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --vfr: #238636;
            --mvfr: #1f6feb;
            --ifr: #da3633;
            --lifr: #8957e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            color: #ffffff;
        }

        .version {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper input {
            width: 100%;
            padding: 10px 35px 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 1rem;
        }

        .clear-search {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
        }

        .clear-search:hover {
            color: var(--text-main);
        }

        .filter-buttons, .country-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button.filter-btn, button.country-btn {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        button.filter-btn:hover, button.country-btn:hover {
            border-color: var(--accent);
        }

        button.filter-btn.active, button.country-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .country-bar {
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .airport-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        .fav-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .fav-btn.active {
            color: #e3b341;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
        }

        .badge-vfr { background: var(--vfr); }
        .badge-mvfr { background: var(--mvfr); }
        .badge-ifr { background: var(--ifr); }
        .badge-lifr { background: var(--lifr); }
        .badge-na { background: var(--text-muted); }

        .card-body {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .card-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        .loading {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Painel de Aeroportos Globais</h1>
        <div class="version">VERSÃO 76.0 - Com Favoritos e Subfiltro por País</div>
    </header>

    <div class="controls">
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Pesquisar ICAO, IATA, Cidade ou Nome...">
            <button class="clear-search" id="clearSearchBtn" title="Limpar busca">&times;</button>
        </div>

        <div class="filter-buttons" id="regionFilters">
            <button class="filter-btn active" data-region="ALL">🌐 Todos</button>
            <button class="filter-btn" data-region="FAV">⭐ Favoritos</button>
            <button class="filter-btn" data-region="SOUTH_AMERICA">🟢 América do Sul</button>
            <button class="filter-btn" data-region="CENTRAL_AMERICA">🟡 América Central</button>
            <button class="filter-btn" data-region="CARIBBEAN">🏝️ Caribe</button>
            <button class="filter-btn" data-region="NORTH_AMERICA">🔵 América do Norte</button>
            <button class="filter-btn" data-region="EUROPE">🇪🇺 Europa</button>
            <button class="filter-btn" data-region="ASIA_ME">🌏 Ásia / Oriente Médio</button>
            <button class="filter-btn" data-region="AFRICA">🌍 África</button>
        </div>

        <!-- Barra dinâmica de países da região selecionada -->
        <div class="country-bar" id="countryBar"></div>
    </div>

    <div class="grid" id="airportGrid">
        <div class="loading">Carregando dados meteorológicos do Worker...</div>
    </div>

    <script>
        let allAirports = [];
        let currentRegion = 'ALL';
        let currentCountry = 'ALL';
        let favorites = JSON.parse(localStorage.getItem('airport_favorites') || '[]');

        async function loadData() {
            try {
                // URL correta do Cloudflare Worker (weathered-grass-f181)
                const res = await fetch('https://weathered-grass-f181.alex-rodrigues1973.workers.dev');
                const data = await res.json();
                if (data.ok) {
                    allAirports = data.rows;
                    render();
                } else {
                    document.getElementById('airportGrid').innerHTML = `<div class="loading">Erro ao carregar dados do servidor.</div>`;
                }
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
                document.getElementById('airportGrid').innerHTML = `<div class="loading">Erro de conexão com o Worker. Verifique o console.</div>`;
            }
        }

        function toggleFavorite(icao) {
            if (favorites.includes(icao)) {
                favorites = favorites.filter(item => item !== icao);
            } else {
                favorites.push(icao);
            }
            localStorage.setItem('airport_favorites', JSON.stringify(favorites));
            render();
        }

        function render() {
            const grid = document.getElementById('airportGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');

            clearBtn.style.display = searchVal ? 'block' : 'none';

            // Atualizar barra de países com base na região selecionada
            const countryBar = document.getElementById('countryBar');
            if (['SOUTH_AMERICA', 'CENTRAL_AMERICA', 'NORTH_AMERICA', 'EUROPE', 'ASIA_ME', 'AFRICA', 'CARIBBEAN'].includes(currentRegion)) {
                const countriesInRegion = [...new Set(allAirports.filter(a => a.group === currentRegion).map(a => a.country))].sort();
                if (countriesInRegion.length > 1) {
                    countryBar.style.display = 'flex';
                    let countryHtml = `<button class="country-btn ${currentCountry === 'ALL' ? 'active' : ''}" data-country="ALL">Todos os Países</button>`;
                    countriesInRegion.forEach(c => {
                        countryHtml += `<button class="country-btn ${currentCountry === c ? 'active' : ''}" data-country="${c}">${c}</button>`;
                    });
                    countryBar.innerHTML = countryHtml;
                } else {
                    countryBar.style.display = 'none';
                    currentCountry = 'ALL';
                }
            } else {
                countryBar.style.display = 'none';
                currentCountry = 'ALL';
            }

            // Filtragem
            const filtered = allAirports.filter(airport => {
                const matchesRegion = currentRegion === 'ALL' || 
                                      (currentRegion === 'FAV' && favorites.includes(airport.icao)) || 
                                      airport.group === currentRegion;
                
                const matchesCountry = currentCountry === 'ALL' || airport.country === currentCountry;

                const matchesSearch = !searchVal || 
                    airport.icao.toLowerCase().includes(searchVal) || 
                    (airport.iata && airport.iata.toLowerCase().includes(searchVal)) || 
                    airport.name.toLowerCase().includes(searchVal) || 
                    airport.city.toLowerCase().includes(searchVal);

                return matchesRegion && matchesCountry && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="loading">Nenhum aeroporto encontrado.</div>`;
                return;
            }

            // Renderizar Cards
            grid.innerHTML = filtered.map(airport => {
                const isFav = favorites.includes(airport.icao);
                const badgeClass = `badge badge-${airport.category.toLowerCase()}`;
                return `
                    <div class="card">
                        <div>
                            <div class="card-header">
                                <h3 class="airport-title">${airport.name}</h3>
                                <div style="display: flex; gap: 6px; align-items: center;">
                                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${airport.icao}')">⭐</button>
                                    <span class="${badgeClass}">${airport.category}</span>
                                </div>
                            </div>
                            <div class="card-body">
                                <strong>ICAO:</strong> ${airport.icao} ${airport.iata ? `| <strong>IATA:</strong> ${airport.iata}` : ''}<br>
                                <strong>Cidade:</strong> ${airport.city} (${airport.country})<br>
                                <strong>Vento:</strong> ${airport.wind} | <strong>QNH:</strong> ${airport.pressure}
                            </div>
                        </div>
                        <div class="card-footer">
                            <span>Pistas: ${airport.runways ? airport.runways.join(', ') : 'N/A'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', render);
        
        document.getElementById('clearSearchBtn').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            render();
        });

        document.getElementById('regionFilters').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentRegion = e.target.getAttribute('data-region');
                currentCountry = 'ALL';
                render();
            }
        });

        document.getElementById('countryBar').addEventListener('click', (e) => {
            if (e.target.classList.contains('country-btn')) {
                document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCountry = e.target.getAttribute('data-country');
                render();
            }
        });

        // Inicializar
        loadData();
    </script>
</body>
</html>
